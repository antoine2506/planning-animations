  app.innerHTML=`${topbar("reports")}<div class="admin-analytics-head"><div><h2>📊 Rapport détaillé des animateurs</h2><p>${escapeHtml(label)} · participation, propositions et activité individuelle.</p></div><button class="btn secondary" id="report-refresh">↻ Actualiser</button></div><div class="analytics-periods" style="margin-bottom:14px">${[["week","Cette semaine"],["7d","7 jours"],["30d","30 jours"],["month","Ce mois"],["90d","3 mois"],["all","Tout"],["custom","Personnalisé"]].map(([k,l])=>`<button class="analytics-period-btn ${key===k?'active':''}" data-report-period="${k}">${l}</button>`).join("")}</div>${key==="custom"?`<div class="card" style="display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end"><div><label>Du</label><input type="date" id="report-start" value="${state.reportCustomStart}"></div><div><label>Au</label><input type="date" id="report-end" value="${state.reportCustomEnd}"></div><button class="btn" id="report-apply">Appliquer</button></div>`:""}<div class="analytics-kpis"><div class="analytics-kpi"><div class="kpi-label">Animateurs actifs</div><div class="kpi-value">${arr.filter(a=>a.joined>0).length}</div><div class="kpi-trend neutral">${arr.length} profils recensés</div></div><div class="analytics-kpi"><div class="kpi-label">Participations</div><div class="kpi-value">${totalJoined}</div><div class="kpi-trend neutral">Animations rejointes</div></div><div class="analytics-kpi"><div class="kpi-label">Heures équipe</div><div class="kpi-value">${totalHours}h</div><div class="kpi-trend neutral">Heures cumulées</div></div><div class="analytics-kpi"><div class="kpi-label">Animations proposées</div><div class="kpi-value">${totalProposed}</div><div class="kpi-trend neutral">Demandes actives</div></div></div><div class="card analytics-card"><div class="analytics-section-title"><div><h3>Détail par animateur</h3><p class="analytics-card-sub" style="margin:4px 0 0">Trames / Events / Anim. = répartition des animations rejointes. Les propositions sont reliées par Discord en priorité, sinon par pseudo.</p></div><span class="analytics-badge">${arr.length} profil(s)</span></div><div style="overflow:auto"><table class="admin-table analytics-ranking-table" style="min-width:1450px"><thead><tr><th>#</th><th>Animateur</th><th>Anims rejointes</th><th>Heures</th><th>Proposées</th><th>Propositions réalisées</th><th>Trames / Events / Anim.</th><th>Serveur</th><th>Jours actifs</th><th>Préférences</th><th>1re / dernière activité</th></tr></thead><tbody>${rows||`<tr><td colspan="11" class="muted">Aucune donnée sur cette période.</td></tr>`}</tbody></table></div></div>`;
  bindNav();
  document.querySelectorAll("[data-report-period]").forEach(b=>b.onclick=()=>{state.reportPeriod=b.dataset.reportPeriod;render();});
  const refresh=document.getElementById("report-refresh");if(refresh)refresh.onclick=async()=>{refresh.disabled=true;await loadAdminData();refresh.disabled=false;render();};

    if (key === "week") { const dow=(now.getDay()+6)%7; start=new Date(now); start.setDate(start.getDate()-dow); days=Math.max(1,Math.floor((now-start)/86400000)+1); label="Cette semaine"; }
    else if (key === "7d") { days = 7; start = new Date(now); start.setDate(start.getDate()-6); label = "7 derniers jours"; }
    else if (key === "30d") { days = 30; start = new Date(now); start.setDate(start.getDate()-29); label = "30 derniers jours"; }
    else if (key === "90d") { days = 90; start = new Date(now); start.setDate(start.getDate()-89); label = "90 derniers jours"; }
    else if (key === "month") { start = new Date(now.getFullYear(), now.getMonth(), 1); days = Math.max(1, Math.floor((now-start)/86400000)+1); label = "Ce mois"; }
    else { start = null; days = null; label = "Tout l'historique"; }
    return { key, start, end, days, label };
  })();
  const inRange = (dateStr, def=periodDef) => {
    if (!dateStr) return false;
    const d = new Date(dateStr + "T00:00:00");
    return (!def.start || d >= def.start) && d <= def.end;
  };
  const periodReservations = state.adminReservations.filter(r => inRange(r.date));
  const approved = periodReservations.filter(r => r.status !== "cancelled" && r.status !== "rejected");
  const cancelled = periodReservations.filter(r => r.status === "cancelled" || r.status === "rejected");
  const pastApproved = approved.filter(r => new Date(r.date+"T00:00:00") < now);
  const upcomingApproved = approved.filter(r => new Date(r.date+"T00:00:00") >= now);
  const durationHours = r => Math.max(0, Number(r.end_idx||0)-Number(r.start_idx||0));
  const periodIds = new Set(periodReservations.map(r=>String(r.id)));
  const periodParticipants = state.adminParticipants.filter(p => periodIds.has(String(p.reservation_id)));
  const approvedIds = new Set(approved.map(r=>String(r.id)));
  const approvedParticipants = periodParticipants.filter(p=>approvedIds.has(String(p.reservation_id)));
  const uniqueAnimatorKeys = new Set(approvedParticipants.map(p=>(p.animator_discord||p.animator_name||"").trim().toLowerCase()).filter(Boolean));
  const totalNeeded = approved.reduce((a,r)=>a+Math.max(0,Number(r.animator_count)||0),0);
  const totalJoined = approved.reduce((a,r)=>a+state.adminParticipants.filter(p=>String(p.reservation_id)===String(r.id)).length,0);
  const fillRate = totalNeeded ? Math.round((totalJoined/totalNeeded)*100) : 0;
  const totalHours = approved.reduce((a,r)=>a+durationHours(r),0);
  const avgParticipants = approved.length ? (totalJoined/approved.length) : 0;
  const cancelRate = periodReservations.length ? Math.round(cancelled.length/periodReservations.length*100) : 0;

  let previousApproved = [], previousParticipants = [];

    const ids = new Set(previousApproved.map(r=>String(r.id)));

    if (!prev && !cur) return `<div class="kpi-trend neutral">Stable</div>`;

    const pct = Math.round((cur-prev)/prev*100); const cls = pct>0?"up":pct<0?"down":"neutral";
    return `<div class="kpi-trend ${cls}">${pct>0?"+":""}${pct}% vs période précédente${suffix}</div>`;
  };

  const countsBy = (arr, fn) => { const m=new Map(); arr.forEach(x=>{const k=fn(x)||"Non renseigné";m.set(k,(m.get(k)||0)+1)}); return [...m.entries()].sort((a,b)=>b[1]-a[1]); };
  const categoryCounts = countsBy(approved, r=>categoryLabel(r.category));
  const requesterCounts = countsBy(approved, r=>r.requester_name||"Non renseigné");
  const targetCounts = countsBy(approved, r=>r.target_type==="autre"?(r.target_other||"Autre"):r.target_type);
  const maxCount = arr => Math.max(1,...arr.map(x=>x[1]));
  const barList = (arr, maxRows=6) => arr.slice(0,maxRows).map(([name,val])=>`<div class="analytics-list-row"><div><div class="name">${escapeHtml(String(name))}</div><div class="analytics-progress"><span style="width:${Math.max(4,Math.round(val/maxCount(arr)*100))}%"></span></div></div><div class="value">${val}</div></div>`).join("") || `<div class="analytics-empty">Aucune donnée sur cette période.</div>`;

  const buildBucket = r => {
    const v=(r.build_size||"").trim().toLowerCase(); if(!v) return "Non renseigné";
    if(/gros|grand|large|énorme|enorme|xl/.test(v)) return "Gros";
    if(/moyen|medium|médium/.test(v)) return "Moyen";
    if(/petit|small|léger|leger/.test(v)) return "Petit";
    if(/aucun|sans|non/.test(v)) return "Sans build";
    return "Autre";
  };
  const buildCounts = countsBy(approved, buildBucket);

    const key=(p.animator_discord||p.animator_name||"").trim().toLowerCase(); if(!key) return;

    if(!requesterMap.has(key)) requesterMap.set(key,{name:r.requester_name||"—",discord:r.requester_discord||"—",count:0,hours:0,last:null});
    const a=requesterMap.get(key); a.count++; a.hours+=durationHours(r); const d=new Date(r.date+"T00:00:00"); if(!a.last||d>a.last)a.last=d;
  });
  const requesterRanking=[...requesterMap.values()].sort((a,b)=>b.hours-a.hours||b.count-a.count||a.name.localeCompare(b.name));
  const requesterRows=requesterRanking.map((a,i)=>`<tr><td><span class="ranking-medal">${i+1}</span></td><td><div class="analytics-name-cell"><strong>${escapeHtml(a.name)}</strong><span>${escapeHtml(a.discord)}</span></div></td><td><strong>${a.count}</strong></td><td><strong>${a.hours}h</strong></td><td>${a.last?a.last.toLocaleDateString("fr-FR"):"—"}</td></tr>`).join("");
  const teamRows=animatorRanking.map((a,i)=>{ const fav=[...a.cats.entries()].sort((x,y)=>y[1]-x[1])[0]?.[0]||"—"; return `<tr><td><span class="ranking-medal">${i+1}</span></td><td><div class="analytics-name-cell"><strong>${escapeHtml(a.name)}</strong><span>${escapeHtml(a.discord)}</span></div></td><td><strong>${a.count}</strong></td><td>${a.hours}h</td><td>${fav}</td><td>${a.last?a.last.toLocaleDateString("fr-FR"):"—"}</td></tr>`; }).join("");

  const underStaffed = upcomingApproved.filter(r=>{const joined=state.adminParticipants.filter(p=>String(p.reservation_id)===String(r.id)).length;return joined<Number(r.animator_count||0);});

  const heatMax=Math.max(1,...dayHour.flat()); const days=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  let heat=`<div class="heatmap"><div></div>${BOUNDARIES.slice(0,9).map(h=>`<div class="heatmap-head">${String(h).padStart(2,"0")}h</div>`).join("")}`;

function getCurrentWeekRanking(){
  const now=new Date(); const day=(now.getDay()+6)%7;
  const start=new Date(now); start.setHours(0,0,0,0); start.setDate(start.getDate()-day);
  const end=new Date(start); end.setDate(end.getDate()+6); end.setHours(23,59,59,999);
  const reservations=(state.adminReservations||[]).filter(r=>r.status!=="cancelled"&&r.status!=="rejected"&&(()=>{const d=new Date(r.date+"T00:00:00");return d>=start&&d<=end;})());
  const ids=new Set(reservations.map(r=>String(r.id))); const map=new Map();
  (state.adminParticipants||[]).filter(p=>ids.has(String(p.reservation_id))).forEach(p=>{
    const key=(p.animator_discord||p.animator_name||"").trim().toLowerCase(); if(!key)return;
    if(!map.has(key))map.set(key,{name:p.animator_name||"—",discord:p.animator_discord||"—",count:0,hours:0});
    const a=map.get(key); a.count++; const r=reservations.find(x=>String(x.id)===String(p.reservation_id)); if(r)a.hours+=Math.max(0,Number(r.end_idx||0)-Number(r.start_idx||0));
  });
  return [...map.values()].sort((a,b)=>b.count-a.count||b.hours-a.hours||a.name.localeCompare(b.name));
}
function launchRankingReveal(mode, suppliedRanking, suppliedLabel){
  const ranking=mode==="week"?getCurrentWeekRanking():(suppliedRanking||[]);
  const label=mode==="week"?"Classement de la semaine":(suppliedLabel||"Classement");
  if(!ranking.length){showToast("Aucune participation à révéler sur cette période.");return;}
  const ordered=[...ranking].reverse(); let index=-1; let overlay=document.createElement("div"); overlay.className="ranking-reveal";
  overlay.innerHTML=`<div class="reveal-bg"></div><button class="reveal-close" aria-label="Fermer">×</button><div class="reveal-stage"><div class="reveal-kicker">${escapeHtml(label)}</div><div class="reveal-countdown">3</div></div><div class="reveal-progress"><span style="width:0%"></span></div>`;
  document.body.appendChild(overlay); document.body.style.overflow="hidden";
  const stage=overlay.querySelector(".reveal-stage"), progress=overlay.querySelector(".reveal-progress span");
  const close=()=>{overlay.remove();document.body.style.overflow="";document.removeEventListener("keydown",keyHandler)};
  overlay.querySelector(".reveal-close").onclick=close; const keyHandler=e=>{if(e.key==="Escape")close();};document.addEventListener("keydown",keyHandler);
  let c=3; const countdown=setInterval(()=>{c--; if(c>0){stage.innerHTML=`<div class="reveal-kicker">${escapeHtml(label)}</div><div class="reveal-countdown">${c}</div>`;}else{clearInterval(countdown);showNext();}},800);
  function particles(){return Array.from({length:54},(_,i)=>`<i class="reveal-particle" style="left:${(i*37)%100}%;--dur:${2.8+(i%7)*.24}s;--delay:${-(i%13)*.18}s;--drift:${-90+(i%10)*20}px;background:${['#ffd76a','#fff','#8d6de8','#6e7bc4'][i%4]}"></i>`).join("");}
  function showNext(){
    index++; if(index>=ordered.length){stage.className="reveal-stage rank1";stage.innerHTML=`<div class="reveal-kicker">Classement terminé</div><div class="reveal-name">🏆 Félicitations à toute l'équipe</div><div class="reveal-stats">Le classement complet reste disponible dans l'espace administrateur.</div><button class="reveal-next" id="reveal-finish">Fermer</button>`;overlay.querySelector("#reveal-finish").onclick=close;progress.style.width="100%";return;}
    const a=ordered[index], rank=ranking.length-index, top=rank<=3; stage.className=`reveal-stage ${top?'top3 rank'+rank:'enter-normal'}`;
    if(rank===1){overlay.insertAdjacentHTML('beforeend',particles()+`<i class="reveal-ring"></i><i class="reveal-ring" style="animation-delay:.55s"></i>`);}
    const suspense=rank===3?"Le podium commence…":rank===2?"Plus que deux…":rank===1?"ET LE GRAND GAGNANT EST…":`${rank}e place`;
    const btn=index===ordered.length-1?"Voir le final":"Révéler la place suivante";
    stage.innerHTML=`<div class="reveal-kicker">${suspense}</div><div class="reveal-rank">${rank===1?'#1':rank===2?'#2':rank===3?'#3':'#'+rank}</div><div class="reveal-name">${rank===1?'🏆 ':rank===2?'🥈 ':rank===3?'🥉 ':''}${escapeHtml(a.name)}</div><div class="reveal-stats"><strong>${a.count}</strong> participation${a.count>1?'s':''} · <strong>${Number(a.hours||0).toFixed(0)}h</strong> d'animations</div><button class="reveal-next" id="reveal-next">${btn}</button>`;
    progress.style.width=`${Math.round((index+1)/ordered.length*100)}%`; stage.querySelector("#reveal-next").onclick=showNext;
  }
}

async function loadAdminData() {
  if (!sb) return;
  const { data, error } = await sb.from("reservations").select("*").order("date", { ascending: false });
  if (error) {
    console.error("Chargement admin des réservations impossible", error);
    showToast("Impossible d’actualiser les réservations : " + (error.message || error.code || "erreur Supabase"));
    // Ne jamais écraser les valeurs déjà chargées par des tableaux vides en cas d'erreur réseau/Supabase.
    return;
  }
  state.adminReservations = Array.isArray(data) ? data : state.adminReservations;
  await loadParticipantsForReservations(state.adminReservations, "adminParticipants");
  state.participants = state.adminParticipants.slice();
  await loadMonthData();
}

async function setStatus(id, status) {
  await sb.from("reservations").update({ status }).eq("id", id);
  await loadAdminData();
  render();
}

  let overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "modal-overlay";
  const startOpts = BOUNDARIES.slice(0, -1).map((h, i) => `<option value="${i}">${boundaryLabel(h)}</option>`).join("");
  overlay.innerHTML = `
    <div class="modal">
      <button class="close-x" id="modal-close">✕</button>
      <h2>Bloquer un créneau</h2>
      <label>Date</label>
      <input type="date" id="b-date" value="${toDateStr(new Date())}">
      <label>Heure de début</label>
      <select id="b-start">${startOpts}</select>
      <label>Heure de fin</label>
      <select id="b-end">${BOUNDARIES.slice(1).map((h, i) => `<option value="${i + 1}">${boundaryLabel(h)}</option>`).join("")}</select>
      <label>Raison (facultatif)</label>
      <input type="text" id="b-reason" placeholder="ex: réunion animateurs">
      <div class="row-actions">
        <button class="btn secondary" id="b-cancel">Annuler</button>
        <button class="btn" id="b-confirm">Bloquer</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("modal-close").onclick = () => overlay.remove();
  document.getElementById("b-cancel").onclick = () => overlay.remove();
  document.getElementById("b-confirm").onclick = async () => {
    const date = document.getElementById("b-date").value;
    const start_idx = parseInt(document.getElementById("b-start").value, 10);
    const end_idx = parseInt(document.getElementById("b-end").value, 10);
    const reason = document.getElementById("b-reason").value;
    if (end_idx <= start_idx) { showToast("L'heure de fin doit être après le début."); return; }
    const { error } = await sb.from("blocked_slots").insert({ date, start_idx, end_idx, reason });
    if (error) { showToast("Impossible de bloquer ce créneau."); return; }
    overlay.remove();
    await Promise.all([loadAdminData(), loadNotifications()]);
    render();
  };
}

async function removeBlock(id) {
  const { error } = await sb.from("blocked_slots").delete().eq("id", id);
  if (error) { showToast("Impossible de supprimer ce créneau."); return; }
  await Promise.all([loadAdminData(), loadNotifications()]);
  showToast("Créneau supprimé.");
  render();
}

/* ================== DEMARRAGE ================== */
async function init() {
  if (!sb) {
    app.innerHTML = `<div class="card"><h2>Configuration manquante</h2>
      <p class="muted">Renseigne SUPABASE_URL et SUPABASE_ANON_KEY en haut du fichier pour activer le site.</p></div>`;
    return;
  }
  await loadSettings();
  await loadMonthData();
  await loadDashboardData();
  await loadNotifications();
  render();
}
init();
</script>
