<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning des animations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #171a22;
    --surface-2: #1f2330;
    --line: rgba(237, 234, 224, 0.09);
    --text: #eceae2;
    --text-dim: #8d90a3;
    --accent: #6e7bc4;
    --green: #4ade80;
    --green-dim: rgba(74, 222, 128, 0.14);
    --orange: #f5a623;
    --orange-dim: rgba(245, 166, 35, 0.14);
    --red: #ef5b5b;
    --red-dim: rgba(239, 91, 91, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 18px 80px; }
  h1, h2, h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  h1 { font-size: 22px; }
  h2 { font-size: 17px; margin-bottom: 14px; }
  p { line-height: 1.5; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 26px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .navlinks { display: flex; gap: 6px; }
  .navlinks button {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  .navlinks button.active { color: var(--text); border-color: var(--accent); }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .muted { color: var(--text-dim); font-size: 13px; }


  /* week view */
  .week-wrap { overflow-x: auto; }
  .week-grid { display: grid; grid-template-columns: 64px repeat(7, minmax(115px, 1fr)); min-width: 875px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .week-cell { min-height: 72px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 7px; background: var(--surface-2); position: relative; cursor: pointer; }
  .week-cell:nth-child(8n) { border-right: none; }
  .week-head { min-height: 46px; background: var(--surface); text-align: center; font-size: 12px; color: var(--text-dim); cursor: default; }
  .week-time { color: var(--text-dim); font-size: 11px; text-align: right; cursor: default; }
  .week-event { border-radius: 7px; padding: 5px 6px; margin-bottom: 4px; font-size: 11px; border-left: 3px solid var(--accent); background: rgba(110,123,196,.16); overflow: hidden; }
  .week-event strong { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .week-event small { color: var(--text-dim); }
  .week-blocked { background: var(--red-dim); }
  .week-free:hover { background: #262b3d; }
  .attachment-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:6px; }
  input[type=file] { width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim); padding:8px; border-radius:8px; font-size:13px; }
  .file-name { font-size:12px; color:var(--text-dim); }
  .cancel-box { margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }

  /* calendar */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-header .month-label { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; }
  .cal-header button {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 15px;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-daylabel { text-align: center; font-size: 11px; color: var(--text-dim); padding-bottom: 4px; }
  .cal-day {
    aspect-ratio: 1;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface-2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px;
    cursor: pointer;
    font-size: 13px;
    position: relative;
  }
  .cal-day.empty { visibility: hidden; cursor: default; }
  .cal-day.selected { border-color: var(--accent); }
  .cal-day .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-green { background: var(--green); }
  .dot-orange { background: var(--orange); }
  .dot-red { background: var(--red); }
  .dot-none { background: var(--line); }

  /* day detail */
  .slot-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 8px; margin-bottom: 6px;
    background: var(--surface-2); font-size: 13.5px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .slot-row:hover { background: #262b3d; }
  .slot-row .time { color: var(--text-dim); min-width: 52px; }
  .slot-row .cat-dots { display: flex; gap: 5px; flex: 1; padding-left: 8px; }
  .cat-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .cat-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12.5px; color: var(--text-dim); flex-wrap: wrap; }
  .cat-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .detail-block {
    background: var(--surface-2); border-radius: 10px; padding: 14px; margin-bottom: 10px;
  }
  .status-pill {
    font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 500;
  }
  .status-pill.green { background: var(--green-dim); color: var(--green); }
  .status-pill.orange { background: var(--orange-dim); color: var(--orange); }
  .status-pill.red { background: var(--red-dim); color: var(--red); }

  .btn {
    background: var(--accent); color: #fff; border: none; padding: 10px 16px;
    border-radius: 9px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: var(--red-dim); color: var(--red); border: 1px solid transparent; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* form */
  label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
  input[type=text], input[type=date], input[type=password], select, textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 11px; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 14px;
  }
  textarea { min-height: 80px; resize: vertical; }
  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .choice-btn {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 12px; border-radius: 9px; font-size: 13.5px; cursor: pointer; text-align: center;
  }
  .choice-btn.selected { border-color: var(--accent); color: var(--accent); }
  .stepper { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
  .stepper button {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--text); font-size: 16px; cursor: pointer;
  }
  .stepper .count { font-family: 'Space Grotesk', sans-serif; font-size: 17px; min-width: 24px; text-align: center; }
  .row-actions { display: flex; gap: 10px; margin-top: 20px; }
  .recap-line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; border-bottom: 1px solid var(--line); }
  .recap-line:last-child { border-bottom: none; }

  .lookup-result { margin-top: 14px; }
  .ref-code {
    font-family: 'Space Grotesk', sans-serif; font-size: 20px; letter-spacing: 0.02em; color: var(--accent);
  }

  table.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.admin-table th, table.admin-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.admin-table th { color: var(--text-dim); font-weight: 500; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters select { width: auto; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat-box { background: var(--surface-2); border-radius: 10px; padding: 14px; text-align: center; }
  .stat-box .num { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; }
  .stat-box .label { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-start; justify-content: center;
    overflow-y: auto; padding: 40px 14px; z-index: 50;
  }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; max-width: 480px; width: 100%; }
  .close-x { float: right; background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--line); padding: 10px 18px;
    border-radius: 9px; font-size: 13px; z-index: 60;
  }

/* V3 — icônes Liquid Glass + liste des participants */
.navlinks button{display:flex;align-items:center;gap:7px;color:#4b5875;font-weight:700}
.navlinks button.active{color:#5968e8}
.nav-icon{width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;color:#7886ad;flex:0 0 auto}
.nav-icon svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.navlinks button.active .nav-icon{color:#6675f2}
.icon-action{display:inline-flex;align-items:center;gap:7px}
.icon-action svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.participant-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.participant-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(101,116,238,.08);border:1px solid rgba(101,116,238,.15);color:#465170;font-size:12px;font-weight:700}
.participant-avatar{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,rgba(116,132,248,.22),rgba(161,123,245,.18));color:#5d69d9;font-size:10px;font-weight:900}
.participant-empty{margin-top:10px;font-size:12px;color:#8b94a8}
.participant-heading{margin-top:14px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7a849b;font-weight:800}


/* ================== ADMIN ANALYTICS ================== */
.admin-analytics-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.admin-analytics-head h2{font-size:28px}.admin-analytics-head p{margin:6px 0 0;color:var(--text-dim)}
.analytics-periods,.analytics-tabs{display:flex;gap:8px;flex-wrap:wrap}
.analytics-period-btn,.analytics-tab-btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);padding:9px 12px;border-radius:12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.18s ease}
.analytics-period-btn:hover,.analytics-tab-btn:hover{transform:translateY(-1px);border-color:rgba(110,123,196,.5)}
.analytics-period-btn.active,.analytics-tab-btn.active{background:linear-gradient(135deg,rgba(110,123,196,.25),rgba(129,92,246,.18));border-color:rgba(110,123,196,.7);color:#fff}
.analytics-tabs{margin:14px 0 20px}.analytics-tab-btn{padding:10px 15px}
.analytics-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 18px}
.analytics-kpi{position:relative;overflow:hidden;padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.045)}
.analytics-kpi:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-35px;top:-45px;background:rgba(110,123,196,.16);filter:blur(8px)}
.analytics-kpi .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);font-weight:800}.analytics-kpi .kpi-value{font-family:'Space Grotesk';font-size:30px;font-weight:700;margin-top:7px}.analytics-kpi .kpi-trend{font-size:11px;margin-top:5px;color:var(--text-dim)}
.kpi-trend.up{color:#4ade80}.kpi-trend.down{color:#ef7676}.kpi-trend.neutral{color:var(--text-dim)}
.analytics-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.analytics-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.analytics-card{padding:18px}.analytics-card h3{font-size:16px;margin-bottom:14px}.analytics-card-sub{font-size:12px;color:var(--text-dim);margin:-8px 0 14px}
.health-list{display:grid;gap:9px}.health-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--line)}.health-item strong{font-size:13px}.health-value{font-size:12px;font-weight:800}.health-good{color:#4ade80}.health-warn{color:#f5a623}.health-bad{color:#ef7676}
.mini-bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}.mini-bar-wrap{flex:1;min-width:0;text-align:center}.mini-bar{width:100%;min-height:3px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#8177e8,#5f6fc4);transition:.2s}.mini-bar-wrap small{display:block;margin-top:7px;color:var(--text-dim);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.analytics-list{display:grid;gap:8px}.analytics-list-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.analytics-list-row:last-child{border-bottom:0}.analytics-list-row .name{font-size:13px;font-weight:700}.analytics-list-row .sub{font-size:11px;color:var(--text-dim);margin-top:2px}.analytics-list-row .value{font-family:'Space Grotesk';font-weight:700}
.heatmap-wrap{overflow:auto;padding-bottom:4px}.heatmap{display:grid;grid-template-columns:52px repeat(9,minmax(42px,1fr));gap:5px;min-width:620px}.heatmap-head,.heatmap-day{font-size:10px;color:var(--text-dim);display:flex;align-items:center;justify-content:center}.heatmap-day{justify-content:flex-start;font-weight:700}.heat-cell{height:34px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:rgba(255,255,255,.82)}
.analytics-ranking-table td,.analytics-ranking-table th{white-space:nowrap}.analytics-name-cell{display:flex;flex-direction:column;gap:2px}.analytics-name-cell span{font-size:10px;color:var(--text-dim)}
.analytics-progress{height:7px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}.analytics-progress>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6e7bc4,#8d6de8)}
.analytics-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.analytics-section-title h3{margin:0}.analytics-badge{font-size:10px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--text-dim)}
.analytics-empty{padding:24px;text-align:center;color:var(--text-dim);font-size:13px}
@media(max-width:780px){.analytics-kpis{grid-template-columns:repeat(2,1fr)}.analytics-grid-2,.analytics-grid-3{grid-template-columns:1fr}.admin-analytics-head h2{font-size:24px}}
@media(max-width:480px){.analytics-kpis{grid-template-columns:1fr 1fr}.analytics-kpi .kpi-value{font-size:25px}}

html[data-theme="light"] .analytics-period-btn,html[data-theme="light"] .analytics-tab-btn,html[data-theme="light"] .analytics-kpi,html[data-theme="light"] .health-item{background:rgba(255,255,255,.72);color:#1d2945;border-color:rgba(86,103,155,.15)}
html[data-theme="light"] .analytics-period-btn.active,html[data-theme="light"] .analytics-tab-btn.active{color:#26325c;background:linear-gradient(135deg,rgba(114,126,216,.19),rgba(151,115,232,.14));border-color:rgba(94,105,192,.38)}
html[data-theme="light"] .heat-cell{color:#24324f;border-color:rgba(86,103,155,.12)}


/* ===== REVEAL CLASSEMENT ADMIN ===== */
.reveal-launch-row{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.reveal-launch-btn{background:linear-gradient(135deg,#6e7bc4,#8d6de8);color:#fff;border:0;box-shadow:0 10px 30px rgba(110,123,196,.22)}
.ranking-reveal{position:fixed;inset:0;z-index:99999;background:#030305;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff}
.ranking-reveal.hidden{display:none}
.reveal-bg{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 45%,rgba(110,123,196,.18),transparent 35%),radial-gradient(circle at 20% 80%,rgba(141,109,232,.12),transparent 30%);animation:revealDrift 8s ease-in-out infinite alternate}
.reveal-close{position:absolute;right:22px;top:22px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;font-size:20px;cursor:pointer}
.reveal-stage{position:relative;z-index:2;width:min(920px,92vw);text-align:center;padding:36px 20px}
.reveal-kicker{text-transform:uppercase;letter-spacing:.28em;font-size:12px;color:#9ca8ff;font-weight:800;margin-bottom:18px}
.reveal-rank{font-family:'Space Grotesk',sans-serif;font-size:clamp(70px,15vw,150px);line-height:.8;font-weight:800;letter-spacing:-.07em;margin:10px 0 24px;text-shadow:0 0 40px rgba(110,123,196,.25)}
.reveal-name{font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,6vw,64px);font-weight:800;letter-spacing:-.04em;margin-bottom:12px}
.reveal-stats{font-size:16px;color:#b8bfd5;margin-bottom:30px}.reveal-stats strong{color:#fff}
.reveal-next{min-width:180px;padding:13px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:#fff;color:#090a0f;font-weight:800;cursor:pointer;font:inherit}
.reveal-progress{position:absolute;left:24px;right:24px;bottom:24px;height:3px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}.reveal-progress span{display:block;height:100%;background:linear-gradient(90deg,#6e7bc4,#a87cff);transition:width .5s ease}
.reveal-countdown{font-family:'Space Grotesk';font-size:clamp(90px,22vw,210px);font-weight:900;animation:revealPulse .85s ease both}
.reveal-stage.enter-normal .reveal-rank{animation:rankDrop .65s cubic-bezier(.2,.9,.2,1) both}.reveal-stage.enter-normal .reveal-name{animation:nameRise .7s .15s both}
.reveal-stage.top3 .reveal-rank{color:#d8dcff;animation:topRank .9s cubic-bezier(.16,1,.3,1) both}.reveal-stage.top3 .reveal-name{animation:nameRise .9s .25s both}
.reveal-stage.rank3 .reveal-rank{color:#d29a70;text-shadow:0 0 50px rgba(210,154,112,.32)}
.reveal-stage.rank2 .reveal-rank{color:#d9e0ed;text-shadow:0 0 60px rgba(217,224,237,.35)}
.reveal-stage.rank1 .reveal-rank{color:#ffd76a;text-shadow:0 0 28px rgba(255,215,106,.7),0 0 90px rgba(255,180,40,.35);animation:winnerRank 1.25s cubic-bezier(.16,1,.3,1) both}
.reveal-stage.rank1 .reveal-name{font-size:clamp(38px,7vw,76px);text-shadow:0 0 30px rgba(255,215,106,.3)}
.reveal-particle{position:absolute;z-index:1;width:8px;height:18px;border-radius:2px;top:-30px;animation:confettiFall var(--dur) linear var(--delay) infinite;opacity:.9}
.reveal-ring{position:absolute;left:50%;top:50%;width:120px;height:120px;border:2px solid rgba(255,215,106,.45);border-radius:50%;transform:translate(-50%,-50%);animation:ringBurst 1.6s ease-out infinite;pointer-events:none}
@keyframes revealDrift{to{transform:translate3d(3%,2%,0) scale(1.05)}}
@keyframes revealPulse{0%{opacity:0;transform:scale(1.8)}55%{opacity:1}100%{transform:scale(1)}}
@keyframes rankDrop{0%{opacity:0;transform:translateY(-80px) scale(1.25);filter:blur(12px)}100%{opacity:1;transform:none;filter:none}}
@keyframes nameRise{0%{opacity:0;transform:translateY(35px)}100%{opacity:1;transform:none}}
@keyframes topRank{0%{opacity:0;transform:scale(2.4);filter:blur(18px)}65%{opacity:1;filter:none}100%{transform:scale(1)}}
@keyframes winnerRank{0%{opacity:0;transform:scale(.2) rotate(-8deg);filter:blur(20px)}55%{opacity:1;transform:scale(1.18) rotate(2deg);filter:none}75%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes confettiFall{0%{transform:translate3d(0,-5vh,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate3d(var(--drift),110vh,0) rotate(800deg);opacity:.8}}
@keyframes ringBurst{0%{opacity:.7;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(6)}}
@media(prefers-reduced-motion:reduce){.ranking-reveal *{animation:none!important;transition:none!important}}

</style>

<style id="modern-redesign">
:root{
  --bg:#080a10;--surface:#10131c;--surface-2:#171b27;--surface-3:#1d2230;
  --line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.15);
  --text:#f5f7fb;--text-dim:#9aa3b5;--accent:#7c8cff;--accent-2:#9b7cff;
  --accent-soft:rgba(124,140,255,.14);--success:#42d392;--warning:#f5b84b;--danger:#ff647c;
  --shadow:0 24px 70px rgba(0,0,0,.35);--radius:18px
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
 margin:0;min-height:100vh;color:var(--text);
 background:radial-gradient(900px 500px at 15% -10%,rgba(124,140,255,.14),transparent 60%),
 radial-gradient(700px 500px at 100% 0%,rgba(155,124,255,.10),transparent 60%),
 linear-gradient(180deg,#090b11 0%,#080a10 100%);
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
 background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
 background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 80%)
}
.wrap{width:min(1380px,calc(100% - 40px));margin:0 auto;padding:34px 0 60px;position:relative}
header,.topbar,.page-header{
 border:1px solid var(--line);background:rgba(16,19,28,.78);backdrop-filter:blur(18px);
 box-shadow:var(--shadow);border-radius:24px
}
header{padding:28px 30px;margin-bottom:18px}
h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1.6px;margin:0 0 8px;font-weight:800}
h2{letter-spacing:-.7px}
.muted{color:var(--text-dim)}
button,.btn{
 border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--text);
 padding:10px 15px;font-weight:700;cursor:pointer;transition:.18s ease
}
button:hover,.btn:hover{transform:translateY(-1px);border-color:var(--line-strong);background:var(--surface-3)}
button.primary,.btn.primary{
 border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));
 box-shadow:0 10px 28px rgba(124,140,255,.22)
}
input,select,textarea{
 width:100%;background:rgba(8,10,16,.72);border:1px solid var(--line);border-radius:12px;
 color:var(--text);padding:12px 13px;outline:none;transition:.18s ease
}
input:focus,select:focus,textarea:focus{border-color:rgba(124,140,255,.7);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{min-height:110px;resize:vertical}
.card,.panel,.modal-content,.calendar,.lookup,.admin-section{
 border:1px solid var(--line)!important;background:rgba(16,19,28,.84)!important;
 box-shadow:0 18px 50px rgba(0,0,0,.22)!important;border-radius:var(--radius)!important
}
.nav,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.nav button,.tabs button{background:rgba(16,19,28,.72);border:1px solid var(--line);padding:11px 16px}
.nav button.active,.tabs button.active{
 background:var(--accent-soft);border-color:rgba(124,140,255,.42);color:#dfe3ff
}
.calendar-grid{gap:8px!important}
.calendar-day,.day,.slot{
 border:1px solid var(--line)!important;background:rgba(23,27,39,.7)!important;
 border-radius:13px!important;transition:.18s ease
}
.calendar-day:hover,.day:hover,.slot:hover{
 border-color:rgba(124,140,255,.4)!important;background:rgba(29,34,48,.9)!important
}
.slot{padding:13px!important}
.slot.available{box-shadow:inset 3px 0 var(--success)}
.slot.pending{box-shadow:inset 3px 0 var(--warning)}
.slot.full,.slot.blocked{box-shadow:inset 3px 0 var(--danger)}
.badge,.pill,.status{
 border-radius:999px!important;padding:5px 9px!important;border:1px solid var(--line)!important;
 background:rgba(255,255,255,.05)!important;font-size:12px!important;font-weight:800!important
}
.modal{background:rgba(0,0,0,.7)!important;backdrop-filter:blur(10px)}
.modal-content{padding:26px!important;max-width:720px!important}
.step,.progress{background:rgba(255,255,255,.04)!important;border-radius:999px!important}
.progress-bar{background:linear-gradient(90deg,var(--accent),var(--accent-2))!important}
table{border-collapse:separate!important;border-spacing:0 7px!important}
th{color:var(--text-dim)!important;font-size:12px!important;text-transform:uppercase;letter-spacing:.08em}
td{background:rgba(23,27,39,.7)!important;border-top:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important}
td:first-child{border-left:1px solid var(--line)!important;border-radius:10px 0 0 10px}
td:last-child{border-right:1px solid var(--line)!important;border-radius:0 10px 10px 0}
@media(max-width:700px){
 .wrap{width:min(100% - 20px,1380px);padding-top:16px}
 header{padding:22px 18px;border-radius:18px}
 .nav,.tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
 .nav button,.tabs button{white-space:nowrap}
}
</style>


<style id="dashboard-styles">

function categoryBadgeHtml(r){const server=r?.target_type==="serveur";const label=server&&r.category==="event"?"EVENT SERVEUR":server&&r.category==="trame"?"TRAME SERVEUR":categoryLabel(r.category);return `<span class="category-badge ${categoryVisualClass(r)}">${escapeHtml(label)}</span>`;}

function reservationEndDate(r){const d=new Date(r.date+"T00:00:00"),h=BOUNDARIES[r.end_idx];if(h===undefined)return d;if(h<17)d.setDate(d.getDate()+1);d.setHours(h,0,0,0);return d;}
function animationIsFinished(r){return new Date()>=reservationEndDate(r);}
function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function genReference() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function participantsFor(reservationId) {

function participantListHtml(reservationId) {
  const people = participantsFor(reservationId);
  if (!people.length) return `<div class="participant-empty">Aucun animateur inscrit pour le moment.</div>`;
  return `<div class="participant-list">${people.map(p => {

    return `<span class="participant-chip" title="${escapeHtml(p.animator_discord || '')}"><span class="participant-avatar">${initial}</span>${name}</span>`;
  }).join("")}</div>`;
}
function participationStats(r) {
  const joined = participantsFor(r.id).length;
  const needed = Math.max(0, Number(r.animator_count) || 0);
  return { joined, needed, missing: Math.max(0, needed - joined), full: needed > 0 && joined >= needed };
}
async function loadParticipantsForReservations(reservations, target = "participants") {
  if (!sb) return;
  const ids = (reservations || []).map(r => r.id).filter(v => v !== undefined && v !== null);
  if (!ids.length) { state[target] = []; return; }
  const { data, error } = await sb.rpc("get_animation_participants", { p_reservation_ids: ids });
  if (!error && (data || []).length) { state[target] = data || []; return; }
  // Fallback direct : utile si la RPC n'existe pas encore ou si une ancienne version renvoie vide.
  const fallback = await sb.from("animation_participants").select("id,reservation_id,animator_name,animator_discord,joined_at").in("reservation_id", ids);
  if (!fallback.error) state[target] = fallback.data || [];
  else {
    state[target] = data || [];
    console.error("Chargement participations impossible", { rpc:error, direct:fallback.error });
  }
}
function myParticipationToken(reservationId) {

function saveParticipationToken(reservationId, token) {

}
function removeParticipationToken(reservationId) {

}

/* Calcule le statut d'un créneau (index 0..8) pour une date donnée */
function slotStatus(dateStr, slotIdx) {
  const blocked = state.blockedSlots.some(b => b.date === dateStr && slotIdx >= b.start_idx && slotIdx < b.end_idx);
  if (blocked) return "red";
  const dayRes = state.reservations.filter(r => r.date === dateStr && slotIdx >= r.start_idx && slotIdx < r.end_idx);
  const approvedSum = dayRes.filter(r => r.status === "approved").reduce((a, r) => a + r.animator_count, 0);
  const hasPending = dayRes.some(r => r.status === "pending");
  if (approvedSum >= state.maxAnimators) return "red";
  if (approvedSum > 0 || hasPending) return "orange";
  return "green";
}

function dayDotColor(dateStr) {
  let worst = "green";
  for (let i = 0; i < BOUNDARIES.length - 1; i++) {
    const s = slotStatus(dateStr, i);
    if (s === "red") return "red";
    if (s === "orange") worst = "orange";
  }
  return worst;
}

function renderDashboard() {
  const today = toDateStr(new Date());
  const weekStart = getWeekStart(new Date());
  const weekDates = Array.from({length:7}, (_,i) => { const d=new Date(weekStart); d.setDate(d.getDate()+i); return toDateStr(d); });
  const approved = state.dashboardReservations.filter(r => r.status === "approved");
  const todayRes = approved.filter(r => r.date === today).sort((a,b)=>a.start_idx-b.start_idx);
  const todayAnimations = todayRes.length;
  const weekAnimations = approved.length;
  const animatorsToday = todayRes.reduce((sum,r) => sum + participationStats(r).joined, 0);

  const oldRes = state.reservations, oldBlk = state.blockedSlots;
  state.reservations = state.dashboardReservations; state.blockedSlots = state.dashboardBlockedSlots;
  let availableSlots = 0;
  for(let i=0;i<BOUNDARIES.length-1;i++) if(slotStatus(today,i)==="green") availableSlots++;
  state.reservations = oldRes; state.blockedSlots = oldBlk;

  const now = new Date();
  const future = approved.map(r => {
    const h = BOUNDARIES[r.start_idx] ?? 17;
    const d = new Date(r.date + "T00:00:00"); d.setHours(h < 17 ? h + 24 : h, 0, 0, 0);
    return {...r, _date:d};
  }).filter(r => r._date >= now).sort((a,b)=>a._date-b._date);
  const next = future[0];
  const nextHtml = next ? `<div class="metric-label">Prochaine animation</div><div class="next-time">${boundaryLabel(BOUNDARIES[next.start_idx])}</div><div class="next-title">${escapeHtml(categoryLabel(next.category))}</div><div class="metric-sub">${next._date.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})} · ${participationStats(next).joined}/${next.animator_count} animateur${next.animator_count>1?'s':''}</div>` : `<div class="metric-label">Prochaine animation</div><div class="next-time">—</div><div class="metric-sub">Aucune animation approuvée à venir cette semaine.</div>`;
  const labels=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  const counts=weekDates.map(d=>approved.filter(r=>r.date===d).length);
  const max=Math.max(1,...counts);
  const bars=counts.map((c,i)=>`<div class="activity-col"><div class="activity-bar-wrap"><div class="activity-bar" title="${c} animation(s)" style="height:${Math.max(4,(c/max)*100)}%"></div></div><div class="activity-day">${labels[i]}</div><div class="activity-count">${c}</div></div>`).join("");
  const hourlyCounts = BOUNDARIES.slice(0,-1).map((h,i) => todayRes.filter(r => i >= r.start_idx && i < r.end_idx).length);
  const hourlyMax = Math.max(1, ...hourlyCounts);
  const hourlyBars = hourlyCounts.map((c,i)=>`<div class="activity-col"><div class="activity-bar-wrap"><div class="activity-bar" title="${c} animation(s) active(s)" style="height:${Math.max(4,(c/hourlyMax)*100)}%"></div></div><div class="activity-day">${boundaryLabel(BOUNDARIES[i])}</div><div class="activity-count">${c}</div></div>`).join("");

  const pinned = approved.find(r => r.is_pinned);

  app.innerHTML = `${topbar("dashboard")}
    <div class="dashboard-hero"><div><h2>Tableau de bord</h2><div class="muted">Vue d'ensemble de l'activité des animations.</div></div><button class="btn" id="dash-new">+ Nouvelle réservation</button></div>
    <div class="card home-rp-warning home-rp-warning-major" style="border:2px solid #ef4444;background:linear-gradient(135deg,rgba(127,29,29,.45),rgba(120,53,15,.25));box-shadow:0 0 0 1px rgba(239,68,68,.15),0 16px 45px rgba(239,68,68,.14)"><div class="warning-kicker" style="font-weight:900;letter-spacing:.08em;color:#fca5a5">⚠️ RÈGLE IMPORTANTE — À RESPECTER</div><h2 style="font-size:24px;margin-top:8px">AUCUNE ANIMATION DE 20H50 À 21H30 — TOUS LES JOURS</h2><p>Ce créneau est réservé aux <strong>captures de drapeaux</strong>. Aucune animation ne doit être lancée ou maintenue pendant cette période.</p><p>⚠️ Les <strong>examens, cours, réunions et autres événements prévus en RP</strong> sont prioritaires. Les animations doivent être organisées autour de ces événements et ne jamais les perturber.</p></div>
    ${pinnedHtml}
    <div class="card next-event next-event-featured" style="margin:0 0 18px">${nextHtml}<div class="dashboard-actions"><button class="btn secondary" id="dash-week">Voir la semaine</button><button class="btn secondary" id="dash-plan">Voir le planning</button></div></div>
    <div class="dashboard-grid">
      <div class="card metric-card"><div class="metric-label">Aujourd'hui</div><div class="metric-value">${todayAnimations}</div><div class="metric-sub">animation${todayAnimations!==1?'s':''} prévue${todayAnimations!==1?'s':''}</div></div>
      <div class="card metric-card"><div class="metric-label">Cette semaine</div><div class="metric-value">${weekAnimations}</div><div class="metric-sub">animation${weekAnimations!==1?'s':''} approuvée${weekAnimations!==1?'s':''}</div></div>
      <div class="card metric-card"><div class="metric-label">Créneaux disponibles</div><div class="metric-value">${availableSlots}<span style="font-size:16px;font-weight:600"> / 9</span></div><div class="metric-sub">aujourd'hui, de 17h à 02h</div></div>
      <div class="card metric-card"><div class="metric-label">Animateurs participants</div><div class="metric-value">${animatorsToday}</div><div class="metric-sub">participations aujourd'hui</div></div>

    <div class="card daily-activity-card" style="margin-top:18px"><div class="daily-activity-head"><div><h2>Activité de la journée</h2><div class="muted">Nombre d'animations actives sur chaque tranche horaire aujourd'hui.</div></div><span class="status-pill">${todayAnimations} animation${todayAnimations!==1?'s':''}</span></div><div class="activity-chart daily-activity-chart">${hourlyBars}</div></div>

  document.getElementById("dash-new").onclick=()=>openReservationForm(today);
  document.getElementById("dash-week").onclick=async()=>{state.view="week";state.selectedDate=today;await loadWeekData();renderWeek();};
  document.getElementById("dash-plan").onclick=()=>{state.view="planning";state.selectedDate=today;render();};
  document.querySelectorAll('[data-today-event]').forEach(el=>el.onclick=()=>{ const r=todayRes.find(x=>String(x.id)===String(el.dataset.todayEvent)); if(!r)return; if(state.adminMode){openDashboardAdminEditor(r);return;} state.reservations=state.dashboardReservations; state.blockedSlots=state.dashboardBlockedSlots; openSlotDetail(r.date,r.start_idx); });
  document.querySelectorAll('[data-open-pinned]').forEach(el=>el.onclick=()=>{ const r=approved.find(x=>String(x.id)===String(el.dataset.openPinned)); if(!r)return; if(state.adminMode){openDashboardAdminEditor(r);return;} state.reservations=state.dashboardReservations; state.blockedSlots=state.dashboardBlockedSlots; openSlotDetail(r.date,r.start_idx); });
  document.querySelectorAll('[data-admin-edit]').forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();const r=approved.find(x=>String(x.id)===String(btn.dataset.adminEdit));if(r)openDashboardAdminEditor(r);});
  bindNav();
}

function renderPlanning() {
  const y = state.visibleMonth.getFullYear();
  const m = state.visibleMonth.getMonth();
  const monthNames = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const firstDay = new Date(y, m, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // lundi = 0
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  let cells = "";
  for (let i = 0; i < startOffset; i++) cells += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(y, m, d);
    const dateStr = toDateStr(dateObj);
    const dot = dayDotColor(dateStr);
    const selected = state.selectedDate === dateStr ? "selected" : "";
    cells += `<div class="cal-day ${selected}" data-day="${dateStr}">
      <span>${d}</span><span class="dot dot-${dot}"></span>
    </div>`;
  }

  let dayDetail = "";
  if (state.selectedDate) {
    const label = new Date(state.selectedDate + "T00:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    let rows = "";
    for (let i = 0; i < BOUNDARIES.length - 1; i++) {
      const status = slotStatus(state.selectedDate, i);
      const label2 = boundaryLabel(BOUNDARIES[i]);
      const statusLabel = status === "green" ? "Disponible" : status === "orange" ? "En partie pris" : "Complet";
      const overlapping = state.reservations.filter(r => r.date === state.selectedDate && i >= r.start_idx && i < r.end_idx && r.status === "approved");
      const cats = [...new Set(overlapping.map(r => r.category))];
      const catDots = cats.map(c => `<span class="cat-dot" style="background:${CATEGORY_COLORS[c] || '#888'}" title="${categoryLabel(c)}"></span>`).join("");
      rows += `<div class="slot-row" data-slotidx="${i}" data-status="${status}">
        <span class="time">${label2}</span>
        <span class="cat-dots">${catDots}</span>
        <span class="status-pill ${status}">${statusLabel}</span>
      </div>`;
    }
    const catLegend = CATEGORIES.map(c => `<span><span class="cat-dot" style="background:${CATEGORY_COLORS[c.id]}"></span>${c.label}</span>`).join("");
    dayDetail = `
      <div class="card">
        <h2 style="text-transform:capitalize">${label}</h2>
        <p class="muted" style="margin:-6px 0 12px">Clique sur un créneau libre pour réserver, ou sur un créneau pris pour voir le détail.</p>
        ${rows}
        <div class="cat-legend">${catLegend}</div>
        <div class="row-actions">
          <button class="btn" id="new-res-btn">+ Nouvelle réservation</button>
        </div>
      </div>`;
  }

  app.innerHTML = `
    ${topbar("planning")}
    <div class="card">
      <div class="cal-header">
        <button id="prev-month">‹</button>
        <span class="month-label" style="text-transform:capitalize">${monthNames[m]} ${y}</span>
        <button id="next-month">›</button>
      </div>
      <div class="cal-grid">
        <div class="cal-daylabel">L</div><div class="cal-daylabel">M</div><div class="cal-daylabel">M</div>
        <div class="cal-daylabel">J</div><div class="cal-daylabel">V</div><div class="cal-daylabel">S</div><div class="cal-daylabel">D</div>
        ${cells}
      </div>
      <p class="muted" style="margin-top:14px">
        <span class="dot dot-green" style="display:inline-block"></span> Disponible &nbsp;
        <span class="dot dot-orange" style="display:inline-block"></span> En partie pris &nbsp;
        <span class="dot dot-red" style="display:inline-block"></span> Complet / bloqué
      </p>
    </div>
    ${dayDetail}
  `;
  bindPlanningEvents();
}

function bindPlanningEvents() {
  document.getElementById("prev-month").onclick = async () => {
    state.visibleMonth = new Date(state.visibleMonth.getFullYear(), state.visibleMonth.getMonth() - 1, 1);
    await loadMonthData(); render();
  };
  document.getElementById("next-month").onclick = async () => {
    state.visibleMonth = new Date(state.visibleMonth.getFullYear(), state.visibleMonth.getMonth() + 1, 1);
    await loadMonthData(); render();
  };
  document.querySelectorAll("[data-day]").forEach(el => {
    el.onclick = () => { state.selectedDate = el.dataset.day; render(); };
  });
  const newBtn = document.getElementById("new-res-btn");
  if (newBtn) newBtn.onclick = () => openReservationForm(state.selectedDate);
  document.querySelectorAll(".slot-row[data-slotidx]").forEach(el => {
    el.onclick = () => {
      const idx = parseInt(el.dataset.slotidx, 10);
      if (el.dataset.status === "green") {
        openReservationForm(state.selectedDate, idx);
      } else {
        openSlotDetail(state.selectedDate, idx);
      }
    };
  });
  bindNav();
}

/* ================== VUE SEMAINE ================== */
function getWeekStart(date) {
  const d = new Date(date);
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  d.setHours(0,0,0,0);
  return d;
}

async function loadWeekData() {
  if (!sb) return;
  const start = getWeekStart(state.selectedDate ? new Date(state.selectedDate + "T00:00:00") : new Date());
  const end = new Date(start); end.setDate(end.getDate() + 6);
  const first = toDateStr(start), last = toDateStr(end);
  const [resR, blkR] = await Promise.all([
    sb.from("reservations").select("*").gte("date", first).lte("date", last).neq("status", "cancelled"),
    sb.from("blocked_slots").select("*").gte("date", first).lte("date", last)
  ]);
  state.reservations = resR.data || [];
  state.blockedSlots = blkR.data || [];
  await loadParticipantsForReservations(state.reservations);
}

function renderWeek() {
  const start = getWeekStart(state.selectedDate ? new Date(state.selectedDate + "T00:00:00") : new Date());
  const days = Array.from({length:7}, (_,i) => { const d=new Date(start); d.setDate(d.getDate()+i); return d; });
  const fmt = d => d.toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"});
  let grid = `<div class="week-cell week-head"></div>` + days.map(d => `<div class="week-cell week-head"><strong>${fmt(d)}</strong></div>`).join("");
  for (let i=0;i<BOUNDARIES.length-1;i++) {
    grid += `<div class="week-cell week-time">${boundaryLabel(BOUNDARIES[i])}</div>`;
    for (const d of days) {
      const dateStr=toDateStr(d);
      const blocked=state.blockedSlots.some(b=>b.date===dateStr && i>=b.start_idx && i<b.end_idx);
      const events=state.reservations.filter(r=>r.date===dateStr && i>=r.start_idx && i<r.end_idx && r.status!=="cancelled");
      let html=blocked ? `<div class="week-event week-blocked"><strong>Bloqué</strong><small>${escapeHtml(state.blockedSlots.find(b=>b.date===dateStr && i>=b.start_idx && i<b.end_idx)?.reason||"")}</small></div>` : "";
      html += events.map(r=>`<div class="week-event ${r.target_type==="serveur"&&(r.category==="event"||r.category==="trame")?"server-highlight":""}" style="${reservationWeekStyle(r)}"><div class="week-event-main">${categoryBadgeHtml(r)}<small>${escapeHtml(r.requester_name)} · ${participationStats(r).joined}/${r.animator_count} anim. · ${participationStats(r).missing ? participationStats(r).missing+' manquant'+(participationStats(r).missing>1?'s':'') : 'équipe complète'}</small></div>${state.adminMode ? `<button class="week-delete-btn" data-quick-delete="${r.id}" title="Supprimer l'animation">×</button>` : ""}</div>`).join("");
      grid += `<div class="week-cell ${!blocked ? 'week-free':''}" data-week-day="${dateStr}" data-week-slot="${i}">${html || '<span class="muted">Libre</span>'}</div>`;
    }
  }
  const first=days[0].toLocaleDateString("fr-FR"), last=days[6].toLocaleDateString("fr-FR");
  app.innerHTML=`${topbar("week")}<div class="card"><div class="cal-header"><button id="prev-week">‹</button><span class="month-label">${first} → ${last}</span><button id="next-week">›</button></div><div class="week-wrap"><div class="week-grid">${grid}</div></div><p class="muted" style="margin-top:12px">Clique sur un créneau libre pour réserver.</p></div>`;
  document.getElementById("prev-week").onclick=async()=>{ state.selectedDate=toDateStr(new Date(start.getFullYear(),start.getMonth(),start.getDate()-7)); await loadWeekData(); renderWeek(); };
  document.getElementById("next-week").onclick=async()=>{ state.selectedDate=toDateStr(new Date(start.getFullYear(),start.getMonth(),start.getDate()+7)); await loadWeekData(); renderWeek(); };
  document.querySelectorAll("[data-week-day]").forEach(el=>el.onclick=()=>{ if(el.querySelector('.week-blocked')) return; const idx=parseInt(el.dataset.weekSlot,10); const st=slotStatus(el.dataset.weekDay,idx); if(st==='green') openReservationForm(el.dataset.weekDay,idx); else openSlotDetail(el.dataset.weekDay,idx); });
  bindNav();
}

async function loadTrameData(){if(!sb)return;const {data,error}=await sb.from("reservations").select("*").eq("category","trame").neq("status","cancelled").order("date",{ascending:false});if(!error)state.trameReservations=data||[];await loadParticipantsForReservations(state.trameReservations);}
function daysSince(d){if(!d)return 9999;const a=new Date(d+"T00:00:00"),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.max(0,Math.floor((b-a)/86400000));}
function renderTrames(){
  const finished=state.trameReservations.filter(r=>animationIsFinished(r)&&r.realized!==false);
  const v=finished.filter(r=>r.trame_type);
  const unassigned=finished.filter(r=>!r.trame_type);
  const sums=TRACKED_TRAME_TYPES.map(t=>{
    const rows=v.filter(r=>r.trame_type===t.id).sort((a,b)=>b.date.localeCompare(a.date));
    const last=rows[0]||null,days=last?daysSince(last.date):9999,total=rows.length;
    const parts=rows.reduce((n,r)=>n+participantsFor(r.id).length,0);
    return{t,rows,last,days,total,parts,avg:total?parts/total:0};
  });
  const cards=sums.map(x=>{
    let cls="",alert="";
    if(!x.last){cls="alert-red";alert="ALERTE — aucune animation";}
    else if(x.days>=5){cls="alert-red";alert=`ALERTE — ${x.days} jours`;}
    else if(x.days>3){cls="alert-orange";alert=`!! ${x.days} jours`;}
    else alert=`À jour · ${x.days} j`;
    const hist=x.rows.slice(0,4).map(r=>`<div class="trame-history-row"><span>${new Date(r.date+"T00:00:00").toLocaleDateString("fr-FR")}</span><span>${participantsFor(r.id).length} animateur(s)</span></div>`).join("");
    return `<div class="trame-card ${cls}"><div class="trame-card-head"><div><h3>${x.t.label}</h3><div class="muted">Animations réalisées</div></div><span class="trame-alert">${alert}</span></div><div class="trame-stats"><div class="trame-stat"><b>${x.total}</b><span>animations</span></div><div class="trame-stat"><b>${x.avg.toFixed(1)}</b><span>anim. moyenne</span></div><div class="trame-stat"><b>${x.parts}</b><span>participations</span></div></div><div class="trame-last">Dernière animation : <strong>${x.last?new Date(x.last.date+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}):"Jamais"}</strong></div>${hist}</div>`;
  }).join("");
  const classified=finished.filter(r=>r.trame_type);
  const reclassHtml=state.adminMode&&classified.length?`<div class="card" style="margin-top:18px"><div class="section-head" style="margin:0 0 12px"><div><h3>🛠️ Reclassement admin</h3><p class="muted">Corrige le rattachement d'une animation en cas d'erreur. « Autre » la retire des statistiques des 4 trames principales.</p></div></div><div style="display:grid;gap:9px">${classified.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="outcome-box"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><strong>${new Date(r.date+"T00:00:00").toLocaleDateString("fr-FR")} · ${escapeHtml(r.requester_name||"Animation")}</strong><div class="muted">Actuellement : ${trameTypeLabel(r.trame_type)} · ${escapeHtml(r.description||"Sans description")}</div></div><select data-reclass-trame="${r.id}" style="min-width:190px">${TRAME_TYPES.map(t=>`<option value="${t.id}" ${r.trame_type===t.id?"selected":""}>${t.label}</option>`).join("")}</select></div></div>`).join("")}</div></div>`:"";
  const unassignedHtml=unassigned.length?`<div class="card" style="margin-top:18px;border-color:rgba(250,204,21,.45)"><div class="section-head" style="margin:0 0 12px"><div><h3>⚠️ ${unassigned.length} ancienne${unassigned.length>1?"s":""} trame${unassigned.length>1?"s":""} à classer</h3><p class="muted">Elles existaient avant le nouveau suivi. Classe-les dans une trame, ou choisis « Autre » si elles ne doivent pas apparaître dans les quatre suivis.</p></div></div><div style="display:grid;gap:10px">${unassigned.map(r=>`<div class="outcome-box"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><strong>${new Date(r.date+"T00:00:00").toLocaleDateString("fr-FR")} · ${escapeHtml(r.requester_name||"Animation")}</strong><div class="muted">${escapeHtml(r.description||"Sans description")}</div></div><div class="outcome-actions" style="margin-top:0">${TRAME_TYPES.map(t=>`<button class="btn secondary" data-assign-trame="${r.id}" data-trame="${t.id}">${t.label.replace("Trame ","")}</button>`).join("")}</div></div></div>`).join("")}</div></div>`:"";
  app.innerHTML=`${topbar("trames")}<div class="section-head"><div><h2>Avancée des trames</h2><p class="muted">Chaque créneau Trame terminé est compté automatiquement dans sa trame, sauf s'il a été signalé comme non réalisé.</p></div></div><div class="trame-legend">Normal : 0 à 3 jours · Orange : plus de 3 jours · Rouge : 5 jours ou plus.</div><div class="trame-grid">${cards}</div>${unassignedHtml}${reclassHtml}`;
  bindNav();bindGlobalControls();
  document.querySelectorAll("[data-assign-trame]").forEach(btn=>btn.onclick=async()=>{
    btn.disabled=true;
    const ok=await markAnimationOutcome(btn.dataset.assignTrame,true,btn.dataset.trame);
    if(ok){await loadTrameData();renderTrames();}else btn.disabled=false;
  });
  document.querySelectorAll("[data-reclass-trame]").forEach(sel=>sel.onchange=async()=>{
    const previous=classified.find(r=>String(r.id)===String(sel.dataset.reclassTrame))?.trame_type;
    if(!confirm(`Reclasser cette animation vers « ${trameTypeLabel(sel.value)} » ?`)){sel.value=previous||"autre";return;}
    sel.disabled=true;
    const ok=await markAnimationOutcome(sel.dataset.reclassTrame,true,sel.value);
    if(ok){await loadTrameData();renderTrames();}else{sel.disabled=false;sel.value=previous||"autre";}
  });
}
async function markAnimationOutcome(id,realized,trameType=null){const {data,error}=await sb.rpc("mark_animation_outcome",{p_reservation_id:id,p_realized:realized,p_trame_type:trameType});if(error||data===false){showToast(error?.message||"Impossible d'enregistrer.");return false}showToast(realized?"Animation réalisée enregistrée.":"Animation non réalisée enregistrée.");await Promise.all([loadMonthData(),loadDashboardData()]);return true;}
function openTrameChoice(r,dateStr,slotIdx){const v=prompt("Valider dans quelle trame ?\n1 Serveur\n2 Vilain\n3 Yuei\n4 Gouvernement");if(v===null)return;const m={"1":"serveur","2":"vilain","3":"yuei","4":"gouvernement",serveur:"serveur",vilain:"vilain",yuei:"yuei",gouvernement:"gouvernement"},c=m[String(v).trim().toLowerCase()];if(!c){showToast("Choix invalide.");return}markAnimationOutcome(r.id,true,c).then(ok=>{if(ok){document.getElementById("modal-overlay")?.remove();openSlotDetail(dateStr,slotIdx)}})}

/* ================== DETAIL D'UN CRENEAU ================== */
function openSlotDetail(dateStr, slotIdx) {
  const overlapping = state.reservations.filter(r => r.date === dateStr && slotIdx >= r.start_idx && slotIdx < r.end_idx && r.status === "approved");
  const blocked = state.blockedSlots.filter(b => b.date === dateStr && slotIdx >= b.start_idx && slotIdx < b.end_idx);

  let body = "";
  blocked.forEach(b => {
    body += `<div class="detail-block">
      <strong style="color:var(--red)">Créneau bloqué</strong>
      <p class="muted" style="margin:6px 0 0">${escapeHtml(b.reason) || "Pas de raison précisée."}</p>
    </div>`;
  });
  if (overlapping.length === 0 && blocked.length === 0) {
    body = `<p class="muted">Ce créneau est disponible.</p>`;
  } else {
    overlapping.forEach(r => {
      const catColor = reservationColor(r);
      const targetLabel = r.target_type === "autre" ? r.target_other : (TARGET_TYPES.find(t => t.id === r.target_type) || {}).label;
      const ps = participationStats(r);
      const pct = ps.needed ? Math.min(100, Math.round((ps.joined / ps.needed) * 100)) : 0;
      body += `
        <div class="detail-block">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span class="cat-dot" style="background:${catColor}"></span>
            ${categoryBadgeHtml(r)}
          </div>
          <div class="recap-line"><span>Horaire</span><span>${boundaryLabel(BOUNDARIES[r.start_idx])} → ${boundaryLabel(BOUNDARIES[r.end_idx])}</span></div>
          <div class="recap-line"><span>Public</span><span>${escapeHtml(targetLabel) || "—"}</span></div>
          ${r.category==="trame"&&r.trame_type?`<div class="recap-line"><span>Suivi trame</span><span>${trameTypeLabel(r.trame_type)}</span></div>`:""}
          <div class="recap-line"><span>Animateurs nécessaires</span><span>${r.animator_count}</span></div>
          <div class="recap-line"><span>Demandeur</span><span>${escapeHtml(r.requester_name)}</span></div>
          ${r.description ? `<p class="muted" style="margin-top:10px">${escapeHtml(r.description)}</p>` : ""}
          <div class="participation-box">
            <div class="participation-top">
              <div><div class="participation-count">${ps.joined} / ${ps.needed} animateurs</div><div class="participation-missing ${ps.full ? 'ok' : ''}">${ps.full ? 'Équipe complète' : `${ps.missing} animateur${ps.missing > 1 ? 's' : ''} manquant${ps.missing > 1 ? 's' : ''}`}</div></div>
              ${myParticipationToken(r.id) ? `<button class="btn secondary leave-btn" data-leave-res="${r.id}">Retirer ma participation</button>` : (ps.full ? `<span class="status-pill green">Complet</span>` : `<button class="btn join-btn" data-join-res="${r.id}">Je participe</button>`)}
            </div>
            ${myParticipationToken(r.id) ? `<div class="my-participation">Tu participes à cette animation depuis cet appareil.</div>` : ""}
            <div class="participation-bar"><div class="participation-fill" style="width:${pct}%"></div></div>
            <div class="participant-heading">Qui participe</div>
            ${participantListHtml(r.id)}
          </div>
          ${animationIsFinished(r) ? `<div class="outcome-box"><div class="outcome-title">Statut de l'animation</div>${r.realized===false?`<div class="outcome-done no">✕ Signalée comme non réalisée</div><div class="outcome-actions"><button class="btn secondary" data-outcome-restore="${r.id}">Annuler le signalement</button></div>`:`<div class="outcome-done yes">✓ Considérée comme réalisée${r.category==="trame"&&r.trame_type?` · ${trameTypeLabel(r.trame_type)}`:""}</div><div class="muted" style="margin-top:6px">Aucune action nécessaire si elle a bien eu lieu.</div><div class="outcome-actions"><button class="btn danger" data-outcome-no="${r.id}">❌ Cette animation n'a pas été réalisée</button></div>`}</div>`:""}
          ${state.adminMode ? `<div class="admin-detail-actions"><button class="btn danger" data-detail-delete="${r.id}">Supprimer définitivement l'animation</button></div>` : ""}
        </div>`;
    });
  }

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal">
      <button class="close-x" id="modal-close">✕</button>
      <h2>${boundaryLabel(BOUNDARIES[slotIdx])} — ${new Date(dateStr + "T00:00:00").toLocaleDateString("fr-FR")}</h2>
      <div style="margin-top:12px">${body}</div>
      <div class="row-actions"><button class="btn secondary" id="detail-close-btn">Fermer</button></div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("modal-close").onclick = () => overlay.remove();
  document.getElementById("detail-close-btn").onclick = () => overlay.remove();
  document.querySelectorAll("[data-join-res]").forEach(btn => btn.onclick = () => {
    const reservation = overlapping.find(r => String(r.id) === String(btn.dataset.joinRes));
    if (reservation) openJoinForm(reservation, dateStr, slotIdx);
  });
  document.querySelectorAll("[data-detail-delete]").forEach(btn => btn.onclick = async () => {
    const current = document.getElementById("modal-overlay"); if (current) current.remove();
    await quickDeleteReservation(btn.dataset.detailDelete);
  });
  document.querySelectorAll("[data-leave-res]").forEach(btn => btn.onclick = async () => {
    const reservationId = btn.dataset.leaveRes;
    const token = myParticipationToken(reservationId);
    if (!token) { showToast("Participation introuvable sur cet appareil."); return; }
    if (!confirm("Retirer ta participation à cette animation ?")) return;
    btn.disabled = true;
    const { data, error } = await sb.rpc("leave_animation_participation", { p_reservation_id: reservationId, p_client_token: token });
    if (error || data === false) { showToast("Impossible de retirer la participation."); btn.disabled = false; return; }
    removeParticipationToken(reservationId);
    await loadParticipantsForReservations(state.reservations);
    if (state.dashboardReservations.length) await loadParticipantsForReservations(state.dashboardReservations);
    showToast("Participation retirée.");
    const current = document.getElementById("modal-overlay"); if (current) current.remove();
    openSlotDetail(dateStr, slotIdx);
  });
  document.querySelectorAll("[data-outcome-restore]").forEach(btn=>btn.onclick=async()=>{const r=overlapping.find(x=>String(x.id)===String(btn.dataset.outcomeRestore));if(!r)return;const ok=await markAnimationOutcome(r.id,true,r.category==="trame"?r.trame_type:null);if(ok){overlay.remove();openSlotDetail(dateStr,slotIdx)}});
  document.querySelectorAll("[data-outcome-no]").forEach(btn=>btn.onclick=async()=>{const r=overlapping.find(x=>String(x.id)===String(btn.dataset.outcomeNo));if(!r)return;if(!confirm("Confirmer que cette animation n'a pas été réalisée ?"))return;const ok=await markAnimationOutcome(r.id,false,null);if(ok){overlay.remove();openSlotDetail(dateStr,slotIdx)}});
}

function openJoinForm(reservation, dateStr, slotIdx) {
  const previous = document.getElementById("modal-overlay");
  if (previous) previous.remove();
  const savedName = localStorage.getItem("animation_animator_name") || "";
  const savedDiscord = localStorage.getItem("animation_animator_discord") || "";
  const ps = participationStats(reservation);
  if (ps.full) { showToast("Cette animation a déjà tous ses animateurs."); return; }
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "modal-overlay";
  overlay.innerHTML = `<div class="modal">
    <button class="close-x" id="join-close">✕</button>
    <h2>Je participe</h2>
    <p class="muted">${categoryLabel(reservation.category)} · ${new Date(reservation.date + "T00:00:00").toLocaleDateString("fr-FR")} · ${boundaryLabel(BOUNDARIES[reservation.start_idx])}</p>
    <div class="participation-box"><strong>${ps.joined} / ${ps.needed}</strong> animateurs inscrits · ${ps.missing} place${ps.missing > 1 ? 's' : ''} restante${ps.missing > 1 ? 's' : ''}</div>
    <label>Ton pseudo *</label>
    <input type="text" id="join-name" value="${escapeHtml(savedName)}" placeholder="Pseudo animateur">
    <label>Discord *</label>
    <input type="text" id="join-discord" value="${escapeHtml(savedDiscord)}" placeholder="@pseudo ou identifiant Discord">
    <div class="row-actions"><button class="btn secondary" id="join-cancel">Annuler</button><button class="btn" id="join-confirm">Confirmer ma participation</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById("join-close").onclick = close;
  document.getElementById("join-cancel").onclick = close;
  document.getElementById("join-confirm").onclick = async () => {
    const name = document.getElementById("join-name").value.trim();
    const discord = document.getElementById("join-discord").value.trim();
    if (!name || !discord) { showToast("Pseudo et Discord sont obligatoires."); return; }
    const btn = document.getElementById("join-confirm"); btn.disabled = true;
    const { data: fresh, error: freshErr } = await sb.rpc("get_animation_participants", { p_reservation_ids: [reservation.id] });
    if (freshErr) { showToast("La table des participations n'est pas encore configurée."); btn.disabled = false; return; }
    if ((fresh || []).length >= Number(reservation.animator_count || 0)) { showToast("L'équipe vient d'être complétée."); close(); return; }
    if ((fresh || []).some(p => (p.animator_discord || "").toLowerCase() === discord.toLowerCase())) { showToast("Tu participes déjà à cette animation."); btn.disabled = false; return; }
    const clientToken = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0, v = c === "x" ? r : (r&0x3|0x8); return v.toString(16); });
    const { error } = await sb.from("animation_participants").insert({ reservation_id: reservation.id, animator_name: name, animator_discord: discord, client_token: clientToken });
    if (error) { showToast(error.code === "23505" ? "Tu participes déjà à cette animation." : "Impossible d'enregistrer la participation."); btn.disabled = false; return; }
    localStorage.setItem("animation_animator_name", name);
    localStorage.setItem("animation_animator_discord", discord);
    saveParticipationToken(reservation.id, clientToken);
    await loadParticipantsForReservations(state.reservations);
    showToast("Participation enregistrée !");
    close();
    openSlotDetail(dateStr, slotIdx);
  };
}

function bindNav() {
  document.querySelectorAll("[data-nav]").forEach(el => {
    el.onclick = async () => { state.view = el.dataset.nav; if (state.view === "week") { if (!state.selectedDate) state.selectedDate = toDateStr(new Date()); await loadWeekData(); } if (state.view === "dashboard") await loadDashboardData(); if (state.view === "trames") await loadTrameData(); if ((state.view === "admin" || state.view === "reports") && state.adminAuthed) await loadAdminData(); render(); };
  });
  bindGlobalControls();
}

/* ================== FORMULAIRE DE RESERVATION ================== */
function openReservationForm(defaultDate, defaultStartIdx) {
  const form = {
    date: defaultDate || toDateStr(new Date()),
    startIdx: typeof defaultStartIdx === "number" ? defaultStartIdx : 0,
    endIdx: typeof defaultStartIdx === "number" ? defaultStartIdx + 1 : 1,
    animatorCount: 2,
    target: null,
    targetOther: "",
    category: null,
    trameType: null,
    description: "",
    buildSize: "",
    attachment: null,
    attachmentUrl: "",
    pseudo: "",
    discord: "",
    step: 1
  };
  renderModal(formStepHtml(form));

  function refresh() { renderModal(formStepHtml(form)); }

  function formStepHtml(f) {
    if (f.step === 1) {
      const startOpts = BOUNDARIES.slice(0, -1).map((h, i) => `<option value="${i}" ${i === f.startIdx ? "selected" : ""}>${boundaryLabel(h)}</option>`).join("");
      const endOpts = BOUNDARIES.slice(f.startIdx + 1).map((h, i) => {
        const idx = f.startIdx + 1 + i;
        return `<option value="${idx}" ${idx === f.endIdx ? "selected" : ""}>${boundaryLabel(h)}</option>`;
      }).join("");
      return `
        <h2>Nouvelle réservation</h2>
        <label>Date</label>
        <input type="date" id="f-date" value="${f.date}">
        <label>Heure de début</label>
        <select id="f-start">${startOpts}</select>
        <label>Heure de fin</label>
        <select id="f-end">${endOpts}</select>
        <label>Nombre d'animateurs souhaité</label>
        <div class="stepper">
          <button id="minus-btn" type="button">−</button>
          <span class="count" id="animator-count">${f.animatorCount}</span>
          <button id="plus-btn" type="button">+</button>
        </div>
        <p class="hint">Recommandé : 2 animateurs.</p>
        <div class="row-actions">
          <button class="btn secondary" id="cancel-btn">Annuler</button>
          <button class="btn" id="next1-btn">Continuer</button>
        </div>`;
    }
    if (f.step === 2) {
      const targetBtns = TARGET_TYPES.map(t => `<div class="choice-btn ${f.target === t.id ? 'selected' : ''}" data-target="${t.id}">${t.label}</div>`).join("");
      const catBtns = CATEGORIES.map(c => `<div class="choice-btn ${f.category === c.id ? 'selected' : ''}" data-cat="${c.id}">${c.label}</div>`).join("");
      return `
        <h2>Détails de l'animation</h2>
        <label>Pour qui ?</label>
        <div class="choice-grid">${targetBtns}</div>
        ${f.target === "autre" ? `<label>Précisez</label><input type="text" id="f-target-other" value="${f.targetOther}">` : ""}
        <label>Catégorie</label>
        <div class="choice-grid">${catBtns}</div>
        ${f.category === "trame" ? `<label>Trame concernée *</label><div class="choice-grid">${TRAME_TYPES.map(t=>`<div class="choice-btn ${f.trameType===t.id?'selected':''}" data-trame-type="${t.id}">${t.label}</div>`).join("")}</div><p class="hint">Une fois le créneau terminé, cette animation comptera automatiquement dans le suivi de cette trame, sauf si elle est signalée comme non réalisée.</p>` : ""}
        <label>Description</label>
        <textarea id="f-desc" placeholder="Expliquez rapidement ce qui est prévu et ce dont vous avez besoin…">${f.description}</textarea>
        <label>Taille du build</label>
        <textarea id="f-build-size" placeholder="Décris ici la taille du build, ses dimensions, son emprise, etc. (ex : 20m × 15m)…">${f.buildSize}</textarea>
        <label>Pièce jointe (facultatif)</label>
        <input type="file" id="f-attachment" accept="image/*,.pdf,.zip,.rar,.7z">
        ${f.attachment ? `<div class="file-name">Fichier sélectionné : ${escapeHtml(f.attachment.name)}</div>` : ""}
        <div class="row-actions">
          <button class="btn secondary" id="back2-btn">Retour</button>
          <button class="btn" id="next2-btn">Continuer</button>
        </div>`;
    }
    if (f.step === 3) {
      return `
        <h2>Qui demande ce créneau ?</h2>
        <label>Votre pseudo *</label>
        <input type="text" id="f-pseudo" value="${f.pseudo}">
        <label>Discord (facultatif)</label>
        <input type="text" id="f-discord" value="${f.discord}" placeholder="@pseudo">
        <div class="row-actions">
          <button class="btn secondary" id="back3-btn">Retour</button>
          <button class="btn" id="next3-btn">Voir le récapitulatif</button>
        </div>`;
    }
    if (f.step === 4) {
      const targetLabel = f.target === "autre" ? f.targetOther : (TARGET_TYPES.find(t => t.id === f.target) || {}).label;
      const catLabel = (CATEGORIES.find(c => c.id === f.category) || {}).label;
      return `
        <h2>Récapitulatif</h2>
        <div class="recap-line"><span>Date</span><span>${new Date(f.date + "T00:00:00").toLocaleDateString("fr-FR")}</span></div>
        <div class="recap-line"><span>Horaire</span><span>${boundaryLabel(BOUNDARIES[f.startIdx])} → ${boundaryLabel(BOUNDARIES[f.endIdx])}</span></div>
        <div class="recap-line"><span>Animateurs</span><span>${f.animatorCount}</span></div>
        <div class="recap-line"><span>Public</span><span>${targetLabel || "—"}</span></div>
        <div class="recap-line"><span>Catégorie</span><span>${catLabel || "—"}</span></div>
        ${f.category==="trame"?`<div class="recap-line"><span>Suivi trame</span><span>${trameTypeLabel(f.trameType)}</span></div>`:""}
        <div class="recap-line"><span>Taille du build</span><span>${escapeHtml(f.buildSize) || "—"}</span></div>
        <div class="recap-line"><span>Pièce jointe</span><span>${f.attachment ? escapeHtml(f.attachment.name) : "Aucune"}</span></div>
        <div class="recap-line"><span>Demandeur</span><span>${f.pseudo}</span></div>
        <div class="row-actions">
          <button class="btn secondary" id="back4-btn">Retour</button>
          <button class="btn" id="confirm-btn">Confirmer la demande</button>
        </div>`;
    }
    if (f.step === "done") {
      return `
        <h2>Réservation confirmée</h2>
        <p>Ton créneau est <strong style="color:var(--green)">réservé</strong>.</p>
        <p class="muted">Numéro de réservation, à garder pour t'y référer :</p>
        <p class="ref-code">${f.reference}</p>
        <div class="row-actions">
          <button class="btn" id="close-done-btn">Fermer</button>
        </div>`;
    }
  }

  function renderModal(innerHtml) {
    let overlay = document.getElementById("modal-overlay");
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.id = "modal-overlay";
      overlay.className = "overlay";
      document.body.appendChild(overlay);
    }
    overlay.innerHTML = `<div class="modal"><button class="close-x" id="modal-close">✕</button>${innerHtml}</div>`;
    document.getElementById("modal-close").onclick = closeModal;

    if (form.step === 1) {
      document.getElementById("f-date").onchange = e => form.date = e.target.value;
      document.getElementById("f-start").onchange = e => { form.startIdx = parseInt(e.target.value, 10); if (form.endIdx <= form.startIdx) form.endIdx = form.startIdx + 1; refresh(); };
      document.getElementById("f-end").onchange = e => form.endIdx = parseInt(e.target.value, 10);
      document.getElementById("minus-btn").onclick = () => { form.animatorCount = Math.max(1, form.animatorCount - 1); document.getElementById("animator-count").textContent = form.animatorCount; };
      document.getElementById("plus-btn").onclick = () => { form.animatorCount = Math.min(state.maxAnimators, form.animatorCount + 1); document.getElementById("animator-count").textContent = form.animatorCount; };
      document.getElementById("cancel-btn").onclick = closeModal;
      document.getElementById("next1-btn").onclick = () => { form.date = document.getElementById("f-date").value; form.step = 2; refresh(); };
    } else if (form.step === 2) {
      document.querySelectorAll("[data-target]").forEach(el => el.onclick = () => { form.target = el.dataset.target; refresh(); });
      document.querySelectorAll("[data-cat]").forEach(el => el.onclick = () => { form.category = el.dataset.cat; if(form.category!=="trame") form.trameType=null; refresh(); });
      document.querySelectorAll("[data-trame-type]").forEach(el => el.onclick = () => { form.trameType = el.dataset.trameType; refresh(); });
      const otherInput = document.getElementById("f-target-other");
      if (otherInput) otherInput.onchange = e => form.targetOther = e.target.value;
      document.getElementById("back2-btn").onclick = () => { form.step = 1; refresh(); };
      document.getElementById("next2-btn").onclick = () => {
        form.description = document.getElementById("f-desc").value;
        form.buildSize = document.getElementById("f-build-size").value.trim();
        if (!form.target) { showToast("Choisis pour qui est l'animation."); return; }
        if (!form.category) { showToast("Choisis une catégorie."); return; }
        if (form.category === "trame" && !form.trameType) { showToast("Choisis la trame concernée."); return; }
        form.step = 3; refresh();
      };
    } else if (form.step === 3) {
      document.getElementById("back3-btn").onclick = () => { form.step = 2; refresh(); };
      document.getElementById("next3-btn").onclick = () => {
        form.pseudo = document.getElementById("f-pseudo").value.trim();
        form.discord = document.getElementById("f-discord").value.trim();
        if (!form.pseudo) { showToast("Ton pseudo est obligatoire."); return; }
        form.step = 4; refresh();
      };
    } else if (form.step === 4) {
      document.getElementById("back4-btn").onclick = () => { form.step = 3; refresh(); };
      document.getElementById("confirm-btn").onclick = async () => {
        document.getElementById("confirm-btn").disabled = true;

        // Vérifie la capacité juste avant d'envoyer, avec les données les plus fraîches possibles.
        const { data: existing } = await sb.from("reservations")
          .select("start_idx,end_idx,animator_count")
          .eq("date", form.date)
          .eq("status", "approved");
        const { data: blocks } = await sb.from("blocked_slots").select("start_idx,end_idx").eq("date", form.date);

        let capacityExceeded = false;
        let isBlocked = false;
        for (let s = form.startIdx; s < form.endIdx; s++) {
          const sum = (existing || [])
            .filter(r => s >= r.start_idx && s < r.end_idx)
            .reduce((a, r) => a + r.animator_count, 0);
          if (sum + form.animatorCount > state.maxAnimators) capacityExceeded = true;
          if ((blocks || []).some(b => s >= b.start_idx && s < b.end_idx)) isBlocked = true;
        }
        if (isBlocked) {
          showToast("Ce créneau est bloqué, choisis un autre horaire.");
          document.getElementById("confirm-btn").disabled = false;
          return;
        }
        if (capacityExceeded) {
          showToast(`Complet sur ce créneau (max ${state.maxAnimators} animateurs). Choisis un autre horaire ou réduis le nombre d'animateurs.`);
          document.getElementById("confirm-btn").disabled = false;
          return;
        }

        const reference = genReference();
        let attachmentUrl = null;
        if (form.attachment) {
          const safeName = form.attachment.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          const path = `${reference}/${Date.now()}-${safeName}`;
          const upload = await sb.storage.from("reservation-attachments").upload(path, form.attachment, { upsert:false });
          if (upload.error) { showToast("Impossible d'envoyer la pièce jointe. Vérifie le bucket Supabase."); document.getElementById("confirm-btn").disabled=false; return; }
          attachmentUrl = sb.storage.from("reservation-attachments").getPublicUrl(path).data.publicUrl;
        }
        const { error } = await sb.from("reservations").insert({
          reference,
          requester_name: form.pseudo,
          requester_discord: form.discord || null,
          date: form.date,
          start_idx: form.startIdx,
          end_idx: form.endIdx,
          animator_count: form.animatorCount,
          target_type: form.target,
          target_other: form.target === "autre" ? form.targetOther : null,
          category: form.category,
          trame_type: form.category === "trame" ? form.trameType : null,
          realized: true,
          description: form.description,
          build_size: form.buildSize || null,
          attachment_url: attachmentUrl,
          status: "approved"
        });
        if (error) {
          console.error("ERREUR SUPABASE CREATION CRENEAU:", error);
          const msg = [error.message, error.details, error.hint, error.code].filter(Boolean).join(" · ");
          showToast("Supabase : " + (msg || "Erreur inconnue"));
          const btn = document.getElementById("confirm-btn");
          if (btn) btn.disabled = false;
          return;
        }
        form.reference = reference;
        form.step = "done";
        refresh();
        await Promise.all([loadMonthData(), loadDashboardData(), loadNotifications()]);
      };
    } else if (form.step === "done") {
      document.getElementById("close-done-btn").onclick = async () => { closeModal(); render(); };
    }
  }

  function closeModal() {
    const overlay = document.getElementById("modal-overlay");
    if (overlay) overlay.remove();
  }
}

  const people=new Map();

  const touch=(a,r)=>{const d=new Date(r.date+"T00:00:00");a.days.add(r.date);if(!a.last||d>a.last)a.last=d;if(!a.first||d<a.first)a.first=d;};
  participants.forEach(p=>{const a=ensure(p.animator_discord,p.animator_name);if(!a)return;const r=active.find(x=>String(x.id)===String(p.reservation_id));if(!r)return;a.joined++;a.joinedHours+=duration(r);touch(a,r);const c=categoryLabel(r.category);a.cats.set(c,(a.cats.get(c)||0)+1);const t=r.target_type==="autre"?(r.target_other||"Autre"):(r.target_type||"—");a.targets.set(t,(a.targets.get(t)||0)+1);if(r.category==="trame")a.trames++;else if(r.category==="event")a.events++;else a.animations++;if(r.target_type==="serveur")a.server++;});
  reservations.forEach(r=>{const a=ensure(r.requester_discord,r.requester_name);if(!a)return;touch(a,r);if(r.status==="cancelled"||r.status==="rejected"){a.cancelledProposed++;return;}a.proposed++;a.proposedHours+=duration(r);if(r.realized!==false)a.realizedProposed++;});
  const arr=[...people.values()].sort((a,b)=>b.joined-a.joined||b.joinedHours-a.joinedHours||b.proposed-a.proposed||a.name.localeCompare(b.name));
  const totalJoined=arr.reduce((n,a)=>n+a.joined,0),totalHours=arr.reduce((n,a)=>n+a.joinedHours,0),totalProposed=arr.reduce((n,a)=>n+a.proposed,0);
