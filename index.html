<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning des animations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #171a22;
    --surface-2: #1f2330;
    --line: rgba(237, 234, 224, 0.09);
    --text: #eceae2;
    --text-dim: #8d90a3;
    --accent: #6e7bc4;
    --green: #4ade80;
    --green-dim: rgba(74, 222, 128, 0.14);
    --orange: #f5a623;
    --orange-dim: rgba(245, 166, 35, 0.14);
    --red: #ef5b5b;
    --red-dim: rgba(239, 91, 91, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 18px 80px; }
  h1, h2, h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  h1 { font-size: 22px; }
  h2 { font-size: 17px; margin-bottom: 14px; }
  p { line-height: 1.5; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 26px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .navlinks { display: flex; gap: 6px; }
  .navlinks button {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  .navlinks button.active { color: var(--text); border-color: var(--accent); }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .muted { color: var(--text-dim); font-size: 13px; }

  /* calendar */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-header .month-label { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; }
  .cal-header button {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 15px;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-daylabel { text-align: center; font-size: 11px; color: var(--text-dim); padding-bottom: 4px; }
  .cal-day {
    aspect-ratio: 1;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface-2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px;
    cursor: pointer;
    font-size: 13px;
    position: relative;
  }
  .cal-day.empty { visibility: hidden; cursor: default; }
  .cal-day.selected { border-color: var(--accent); }
  .cal-day .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-green { background: var(--green); }
  .dot-orange { background: var(--orange); }
  .dot-red { background: var(--red); }
  .dot-none { background: var(--line); }

  /* day detail */
  .slot-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 8px; margin-bottom: 6px;
    background: var(--surface-2); font-size: 13.5px;
  }
  .slot-row .time { color: var(--text-dim); min-width: 52px; }
  .status-pill {
    font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 500;
  }
  .status-pill.green { background: var(--green-dim); color: var(--green); }
  .status-pill.orange { background: var(--orange-dim); color: var(--orange); }
  .status-pill.red { background: var(--red-dim); color: var(--red); }

  .btn {
    background: var(--accent); color: #fff; border: none; padding: 10px 16px;
    border-radius: 9px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: var(--red-dim); color: var(--red); border: 1px solid transparent; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* form */
  label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
  input[type=text], input[type=date], input[type=password], select, textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 11px; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 14px;
  }
  textarea { min-height: 80px; resize: vertical; }
  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .choice-btn {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 12px; border-radius: 9px; font-size: 13.5px; cursor: pointer; text-align: center;
  }
  .choice-btn.selected { border-color: var(--accent); color: var(--accent); }
  .stepper { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
  .stepper button {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--text); font-size: 16px; cursor: pointer;
  }
  .stepper .count { font-family: 'Space Grotesk', sans-serif; font-size: 17px; min-width: 24px; text-align: center; }
  .row-actions { display: flex; gap: 10px; margin-top: 20px; }
  .recap-line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; border-bottom: 1px solid var(--line); }
  .recap-line:last-child { border-bottom: none; }

  .lookup-result { margin-top: 14px; }
  .ref-code {
    font-family: 'Space Grotesk', sans-serif; font-size: 20px; letter-spacing: 0.02em; color: var(--accent);
  }

  table.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.admin-table th, table.admin-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.admin-table th { color: var(--text-dim); font-weight: 500; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters select { width: auto; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat-box { background: var(--surface-2); border-radius: 10px; padding: 14px; text-align: center; }
  .stat-box .num { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; }
  .stat-box .label { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-start; justify-content: center;
    overflow-y: auto; padding: 40px 14px; z-index: 50;
  }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; max-width: 480px; width: 100%; }
  .close-x { float: right; background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--line); padding: 10px 18px;
    border-radius: 9px; font-size: 13px; z-index: 60;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading muted">Chargement…</div>
</div>

<script>
/* ================== CONFIGURATION ================== */
/* Remplace ces deux valeurs par celles de ton projet Supabase
   (Project Settings > API > Project URL / anon public key). */
const SUPABASE_URL = "https://kicssewehhkakgpkzqai.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_rRv23bjZtzuRP2ldeyj4qA_ftK8Unxp";

/* Mot de passe pour accéder à /admin. Change-le avant de mettre le site en ligne.
   Attention : c'est une protection simple côté client, pas un vrai système sécurisé
   (quelqu'un qui inspecte le code source peut le voir). Pour une vraie sécurité,
   il faudrait un compte Supabase Auth + des règles RLS côté serveur. */
const ADMIN_PASSWORD = "change-moi";

const TARGET_TYPES = [
  { id: "yuei", label: "Yuei" },
  { id: "vilains", label: "Vilains" },
  { id: "serveur", label: "Serveur" },
  { id: "autre", label: "Autre" }
];
const CATEGORIES = [
  { id: "trame", label: "Trame" },
  { id: "animation", label: "Animation" },
  { id: "event", label: "Event" }
];
/* Bornes des créneaux : 17h -> 02h (9 créneaux d'une heure). */
const BOUNDARIES = [17, 18, 19, 20, 21, 22, 23, 0, 1, 2];
function boundaryLabel(h) { return String(h).padStart(2, "0") + ":00"; }

/* ================== ETAT ================== */
const sb = (SUPABASE_URL.startsWith("http")) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let state = {
  view: "planning", // planning | lookup | admin
  today: new Date(),
  visibleMonth: new Date(),
  selectedDate: null,
  reservations: [],
  blockedSlots: [],
  maxAnimators: 10,
  adminAuthed: false,
  adminReservations: [],
  filters: { status: "all", category: "all", target: "all" }
};

const app = document.getElementById("app");

function pad(n) { return String(n).padStart(2, "0"); }
function toDateStr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function genReference() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return "ANIM-" + s;
}
function showToast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

/* ================== DONNEES ================== */
async function loadSettings() {
  if (!sb) return;
  const { data } = await sb.from("settings").select("*").eq("key", "max_animators").maybeSingle();
  if (data) state.maxAnimators = parseInt(data.value, 10) || 10;
}

async function loadMonthData() {
  if (!sb) return;
  const y = state.visibleMonth.getFullYear();
  const m = state.visibleMonth.getMonth();
  const first = toDateStr(new Date(y, m, 1));
  const last = toDateStr(new Date(y, m + 1, 0));
  const [resR, blkR] = await Promise.all([
    sb.from("reservations").select("*").gte("date", first).lte("date", last).neq("status", "cancelled"),
    sb.from("blocked_slots").select("*").gte("date", first).lte("date", last)
  ]);
  state.reservations = resR.data || [];
  state.blockedSlots = blkR.data || [];
}

/* Calcule le statut d'un créneau (index 0..8) pour une date donnée */
function slotStatus(dateStr, slotIdx) {
  const blocked = state.blockedSlots.some(b => b.date === dateStr && slotIdx >= b.start_idx && slotIdx < b.end_idx);
  if (blocked) return "red";
  const dayRes = state.reservations.filter(r => r.date === dateStr && slotIdx >= r.start_idx && slotIdx < r.end_idx);
  const approvedSum = dayRes.filter(r => r.status === "approved").reduce((a, r) => a + r.animator_count, 0);
  const hasPending = dayRes.some(r => r.status === "pending");
  if (approvedSum >= state.maxAnimators) return "red";
  if (approvedSum > 0 || hasPending) return "orange";
  return "green";
}

function dayDotColor(dateStr) {
  let worst = "green";
  for (let i = 0; i < BOUNDARIES.length - 1; i++) {
    const s = slotStatus(dateStr, i);
    if (s === "red") return "red";
    if (s === "orange") worst = "orange";
  }
  return worst;
}

/* ================== RENDU ================== */
function render() {
  if (state.view === "planning") renderPlanning();
  else if (state.view === "lookup") renderLookup();
  else if (state.view === "admin") renderAdmin();
}

function topbar(active) {
  return `
    <div class="topbar">
      <h1>Planning des animations</h1>
      <div class="navlinks">
        <button data-nav="planning" class="${active === 'planning' ? 'active' : ''}">Planning</button>
        <button data-nav="lookup" class="${active === 'lookup' ? 'active' : ''}">Suivre une demande</button>
        <button data-nav="admin" class="${active === 'admin' ? 'active' : ''}">Admin</button>
      </div>
    </div>`;
}

function renderPlanning() {
  const y = state.visibleMonth.getFullYear();
  const m = state.visibleMonth.getMonth();
  const monthNames = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const firstDay = new Date(y, m, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // lundi = 0
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  let cells = "";
  for (let i = 0; i < startOffset; i++) cells += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(y, m, d);
    const dateStr = toDateStr(dateObj);
    const dot = dayDotColor(dateStr);
    const selected = state.selectedDate === dateStr ? "selected" : "";
    cells += `<div class="cal-day ${selected}" data-day="${dateStr}">
      <span>${d}</span><span class="dot dot-${dot}"></span>
    </div>`;
  }

  let dayDetail = "";
  if (state.selectedDate) {
    const label = new Date(state.selectedDate + "T00:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    let rows = "";
    for (let i = 0; i < BOUNDARIES.length - 1; i++) {
      const status = slotStatus(state.selectedDate, i);
      const label2 = boundaryLabel(BOUNDARIES[i]);
      const statusLabel = status === "green" ? "Disponible" : status === "orange" ? "En partie pris" : "Complet";
      rows += `<div class="slot-row"><span class="time">${label2}</span><span class="status-pill ${status}">${statusLabel}</span></div>`;
    }
    dayDetail = `
      <div class="card">
        <h2 style="text-transform:capitalize">${label}</h2>
        ${rows}
        <div class="row-actions">
          <button class="btn" id="new-res-btn">+ Nouvelle réservation</button>
        </div>
      </div>`;
  }

  app.innerHTML = `
    ${topbar("planning")}
    <div class="card">
      <div class="cal-header">
        <button id="prev-month">‹</button>
        <span class="month-label" style="text-transform:capitalize">${monthNames[m]} ${y}</span>
        <button id="next-month">›</button>
      </div>
      <div class="cal-grid">
        <div class="cal-daylabel">L</div><div class="cal-daylabel">M</div><div class="cal-daylabel">M</div>
        <div class="cal-daylabel">J</div><div class="cal-daylabel">V</div><div class="cal-daylabel">S</div><div class="cal-daylabel">D</div>
        ${cells}
      </div>
      <p class="muted" style="margin-top:14px">
        <span class="dot dot-green" style="display:inline-block"></span> Disponible &nbsp;
        <span class="dot dot-orange" style="display:inline-block"></span> En partie pris &nbsp;
        <span class="dot dot-red" style="display:inline-block"></span> Complet / bloqué
      </p>
    </div>
    ${dayDetail}
  `;
  bindPlanningEvents();
}

function bindPlanningEvents() {
  document.getElementById("prev-month").onclick = async () => {
    state.visibleMonth = new Date(state.visibleMonth.getFullYear(), state.visibleMonth.getMonth() - 1, 1);
    await loadMonthData(); render();
  };
  document.getElementById("next-month").onclick = async () => {
    state.visibleMonth = new Date(state.visibleMonth.getFullYear(), state.visibleMonth.getMonth() + 1, 1);
    await loadMonthData(); render();
  };
  document.querySelectorAll("[data-day]").forEach(el => {
    el.onclick = () => { state.selectedDate = el.dataset.day; render(); };
  });
  const newBtn = document.getElementById("new-res-btn");
  if (newBtn) newBtn.onclick = () => openReservationForm(state.selectedDate);
  bindNav();
}

function bindNav() {
  document.querySelectorAll("[data-nav]").forEach(el => {
    el.onclick = () => { state.view = el.dataset.nav; render(); };
  });
}

/* ================== FORMULAIRE DE RESERVATION ================== */
function openReservationForm(defaultDate) {
  const form = {
    date: defaultDate || toDateStr(new Date()),
    startIdx: 0,
    endIdx: 1,
    animatorCount: 2,
    target: null,
    targetOther: "",
    category: null,
    description: "",
    pseudo: "",
    discord: "",
    step: 1
  };
  renderModal(formStepHtml(form));

  function refresh() { renderModal(formStepHtml(form)); }

  function formStepHtml(f) {
    if (f.step === 1) {
      const startOpts = BOUNDARIES.slice(0, -1).map((h, i) => `<option value="${i}" ${i === f.startIdx ? "selected" : ""}>${boundaryLabel(h)}</option>`).join("");
      const endOpts = BOUNDARIES.slice(f.startIdx + 1).map((h, i) => {
        const idx = f.startIdx + 1 + i;
        return `<option value="${idx}" ${idx === f.endIdx ? "selected" : ""}>${boundaryLabel(h)}</option>`;
      }).join("");
      return `
        <h2>Nouvelle réservation</h2>
        <label>Date</label>
        <input type="date" id="f-date" value="${f.date}">
        <label>Heure de début</label>
        <select id="f-start">${startOpts}</select>
        <label>Heure de fin</label>
        <select id="f-end">${endOpts}</select>
        <label>Nombre d'animateurs souhaité</label>
        <div class="stepper">
          <button id="minus-btn" type="button">−</button>
          <span class="count" id="animator-count">${f.animatorCount}</span>
          <button id="plus-btn" type="button">+</button>
        </div>
        <p class="hint">Recommandé : 2 animateurs.</p>
        <div class="row-actions">
          <button class="btn secondary" id="cancel-btn">Annuler</button>
          <button class="btn" id="next1-btn">Continuer</button>
        </div>`;
    }
    if (f.step === 2) {
      const targetBtns = TARGET_TYPES.map(t => `<div class="choice-btn ${f.target === t.id ? 'selected' : ''}" data-target="${t.id}">${t.label}</div>`).join("");
      const catBtns = CATEGORIES.map(c => `<div class="choice-btn ${f.category === c.id ? 'selected' : ''}" data-cat="${c.id}">${c.label}</div>`).join("");
      return `
        <h2>Détails de l'animation</h2>
        <label>Pour qui ?</label>
        <div class="choice-grid">${targetBtns}</div>
        ${f.target === "autre" ? `<label>Précisez</label><input type="text" id="f-target-other" value="${f.targetOther}">` : ""}
        <label>Catégorie</label>
        <div class="choice-grid">${catBtns}</div>
        <label>Description</label>
        <textarea id="f-desc" placeholder="Expliquez rapidement ce qui est prévu et ce dont vous avez besoin…">${f.description}</textarea>
        <div class="row-actions">
          <button class="btn secondary" id="back2-btn">Retour</button>
          <button class="btn" id="next2-btn">Continuer</button>
        </div>`;
    }
    if (f.step === 3) {
      return `
        <h2>Qui demande ce créneau ?</h2>
        <label>Votre pseudo *</label>
        <input type="text" id="f-pseudo" value="${f.pseudo}">
        <label>Discord (facultatif)</label>
        <input type="text" id="f-discord" value="${f.discord}" placeholder="@pseudo">
        <div class="row-actions">
          <button class="btn secondary" id="back3-btn">Retour</button>
          <button class="btn" id="next3-btn">Voir le récapitulatif</button>
        </div>`;
    }
    if (f.step === 4) {
      const targetLabel = f.target === "autre" ? f.targetOther : (TARGET_TYPES.find(t => t.id === f.target) || {}).label;
      const catLabel = (CATEGORIES.find(c => c.id === f.category) || {}).label;
      return `
        <h2>Récapitulatif</h2>
        <div class="recap-line"><span>Date</span><span>${new Date(f.date + "T00:00:00").toLocaleDateString("fr-FR")}</span></div>
        <div class="recap-line"><span>Horaire</span><span>${boundaryLabel(BOUNDARIES[f.startIdx])} → ${boundaryLabel(BOUNDARIES[f.endIdx])}</span></div>
        <div class="recap-line"><span>Animateurs</span><span>${f.animatorCount}</span></div>
        <div class="recap-line"><span>Public</span><span>${targetLabel || "—"}</span></div>
        <div class="recap-line"><span>Catégorie</span><span>${catLabel || "—"}</span></div>
        <div class="recap-line"><span>Demandeur</span><span>${f.pseudo}</span></div>
        <div class="row-actions">
          <button class="btn secondary" id="back4-btn">Retour</button>
          <button class="btn" id="confirm-btn">Confirmer la demande</button>
        </div>`;
    }
    if (f.step === "done") {
      return `
        <h2>Réservation confirmée</h2>
        <p>Ton créneau est <strong style="color:var(--green)">réservé</strong>.</p>
        <p class="muted">Numéro de réservation, à garder pour t'y référer :</p>
        <p class="ref-code">${f.reference}</p>
        <div class="row-actions">
          <button class="btn" id="close-done-btn">Fermer</button>
        </div>`;
    }
  }

  function renderModal(innerHtml) {
    let overlay = document.getElementById("modal-overlay");
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.id = "modal-overlay";
      overlay.className = "overlay";
      document.body.appendChild(overlay);
    }
    overlay.innerHTML = `<div class="modal"><button class="close-x" id="modal-close">✕</button>${innerHtml}</div>`;
    document.getElementById("modal-close").onclick = closeModal;

    if (form.step === 1) {
      document.getElementById("f-date").onchange = e => form.date = e.target.value;
      document.getElementById("f-start").onchange = e => { form.startIdx = parseInt(e.target.value, 10); if (form.endIdx <= form.startIdx) form.endIdx = form.startIdx + 1; refresh(); };
      document.getElementById("f-end").onchange = e => form.endIdx = parseInt(e.target.value, 10);
      document.getElementById("minus-btn").onclick = () => { form.animatorCount = Math.max(1, form.animatorCount - 1); document.getElementById("animator-count").textContent = form.animatorCount; };
      document.getElementById("plus-btn").onclick = () => { form.animatorCount = Math.min(state.maxAnimators, form.animatorCount + 1); document.getElementById("animator-count").textContent = form.animatorCount; };
      document.getElementById("cancel-btn").onclick = closeModal;
      document.getElementById("next1-btn").onclick = () => { form.date = document.getElementById("f-date").value; form.step = 2; refresh(); };
    } else if (form.step === 2) {
      document.querySelectorAll("[data-target]").forEach(el => el.onclick = () => { form.target = el.dataset.target; refresh(); });
      document.querySelectorAll("[data-cat]").forEach(el => el.onclick = () => { form.category = el.dataset.cat; refresh(); });
      const otherInput = document.getElementById("f-target-other");
      if (otherInput) otherInput.onchange = e => form.targetOther = e.target.value;
      document.getElementById("back2-btn").onclick = () => { form.step = 1; refresh(); };
      document.getElementById("next2-btn").onclick = () => {
        form.description = document.getElementById("f-desc").value;
        if (!form.target) { showToast("Choisis pour qui est l'animation."); return; }
        if (!form.category) { showToast("Choisis une catégorie."); return; }
        form.step = 3; refresh();
      };
    } else if (form.step === 3) {
      document.getElementById("back3-btn").onclick = () => { form.step = 2; refresh(); };
      document.getElementById("next3-btn").onclick = () => {
        form.pseudo = document.getElementById("f-pseudo").value.trim();
        form.discord = document.getElementById("f-discord").value.trim();
        if (!form.pseudo) { showToast("Ton pseudo est obligatoire."); return; }
        form.step = 4; refresh();
      };
    } else if (form.step === 4) {
      document.getElementById("back4-btn").onclick = () => { form.step = 3; refresh(); };
      document.getElementById("confirm-btn").onclick = async () => {
        document.getElementById("confirm-btn").disabled = true;

        // Vérifie la capacité juste avant d'envoyer, avec les données les plus fraîches possibles.
        const { data: existing } = await sb.from("reservations")
          .select("start_idx,end_idx,animator_count")
          .eq("date", form.date)
          .eq("status", "approved");
        const { data: blocks } = await sb.from("blocked_slots").select("start_idx,end_idx").eq("date", form.date);

        let capacityExceeded = false;
        let isBlocked = false;
        for (let s = form.startIdx; s < form.endIdx; s++) {
          const sum = (existing || [])
            .filter(r => s >= r.start_idx && s < r.end_idx)
            .reduce((a, r) => a + r.animator_count, 0);
          if (sum + form.animatorCount > state.maxAnimators) capacityExceeded = true;
          if ((blocks || []).some(b => s >= b.start_idx && s < b.end_idx)) isBlocked = true;
        }
        if (isBlocked) {
          showToast("Ce créneau est bloqué, choisis un autre horaire.");
          document.getElementById("confirm-btn").disabled = false;
          return;
        }
        if (capacityExceeded) {
          showToast(`Complet sur ce créneau (max ${state.maxAnimators} animateurs). Choisis un autre horaire ou réduis le nombre d'animateurs.`);
          document.getElementById("confirm-btn").disabled = false;
          return;
        }

        const reference = genReference();
        const { error } = await sb.from("reservations").insert({
          reference,
          requester_name: form.pseudo,
          requester_discord: form.discord || null,
          date: form.date,
          start_idx: form.startIdx,
          end_idx: form.endIdx,
          animator_count: form.animatorCount,
          target_type: form.target,
          target_other: form.target === "autre" ? form.targetOther : null,
          category: form.category,
          description: form.description,
          status: "approved"
        });
        if (error) { showToast("Erreur lors de l'envoi. Réessaie."); document.getElementById("confirm-btn").disabled = false; return; }
        form.reference = reference;
        form.step = "done";
        refresh();
        await loadMonthData();
      };
    } else if (form.step === "done") {
      document.getElementById("close-done-btn").onclick = async () => { closeModal(); render(); };
    }
  }

  function closeModal() {
    const overlay = document.getElementById("modal-overlay");
    if (overlay) overlay.remove();
  }
}

/* ================== SUIVI D'UNE DEMANDE ================== */
function renderLookup() {
  app.innerHTML = `
    ${topbar("lookup")}
    <div class="card">
      <h2>Suivre une demande</h2>
      <label>Numéro de réservation</label>
      <input type="text" id="ref-input" placeholder="ANIM-XXXXX">
      <div class="row-actions"><button class="btn" id="lookup-btn">Vérifier</button></div>
      <div class="lookup-result" id="lookup-result"></div>
    </div>`;
  bindNav();
  document.getElementById("lookup-btn").onclick = async () => {
    const ref = document.getElementById("ref-input").value.trim().toUpperCase();
    const resultEl = document.getElementById("lookup-result");
    if (!ref) return;
    const { data } = await sb.from("reservations").select("*").eq("reference", ref).maybeSingle();
    if (!data) { resultEl.innerHTML = `<p class="muted">Aucune réservation trouvée avec ce numéro.</p>`; return; }
    const statusLabel = { pending: "En attente", approved: "Validée", rejected: "Refusée", cancelled: "Annulée" }[data.status] || data.status;
    const statusColor = { pending: "orange", approved: "green", rejected: "red", cancelled: "red" }[data.status] || "orange";
    resultEl.innerHTML = `
      <div class="recap-line"><span>Date</span><span>${new Date(data.date + "T00:00:00").toLocaleDateString("fr-FR")}</span></div>
      <div class="recap-line"><span>Horaire</span><span>${boundaryLabel(BOUNDARIES[data.start_idx])} → ${boundaryLabel(BOUNDARIES[data.end_idx])}</span></div>
      <div class="recap-line"><span>Catégorie</span><span>${data.category}</span></div>
      <div class="recap-line"><span>Statut</span><span class="status-pill ${statusColor}">${statusLabel}</span></div>`;
  };
}

/* ================== ADMIN ================== */
function renderAdmin() {
  if (!state.adminAuthed) {
    app.innerHTML = `
      ${topbar("admin")}
      <div class="card">
        <h2>Connexion admin</h2>
        <label>Mot de passe</label>
        <input type="password" id="admin-pass">
        <div class="row-actions"><button class="btn" id="admin-login-btn">Se connecter</button></div>
      </div>`;
    bindNav();
    document.getElementById("admin-login-btn").onclick = () => {
      if (document.getElementById("admin-pass").value === ADMIN_PASSWORD) {
        state.adminAuthed = true;
        loadAdminData().then(render);
      } else {
        showToast("Mot de passe incorrect.");
      }
    };
    return;
  }

  const todayStr = toDateStr(new Date());
  const todayCount = state.adminReservations.filter(r => r.date === todayStr && r.status === "approved").length;
  const monthCount = state.adminReservations.filter(r => r.status === "approved").length;
  const cancelledCount = state.adminReservations.filter(r => r.status === "cancelled" || r.status === "rejected").length;

  const filtered = state.adminReservations.filter(r => {
    if (state.filters.status !== "all" && r.status !== state.filters.status) return false;
    if (state.filters.category !== "all" && r.category !== state.filters.category) return false;
    if (state.filters.target !== "all" && r.target_type !== state.filters.target) return false;
    return true;
  }).sort((a, b) => (a.date + a.start_idx).localeCompare(b.date + b.start_idx));

  const rows = filtered.map(r => {
    const statusColor = { approved: "green", rejected: "red", cancelled: "red" }[r.status] || "green";
    const statusLabel = { approved: "Confirmée", rejected: "Refusée", cancelled: "Annulée" }[r.status] || r.status;
    return `<tr>
      <td>${new Date(r.date + "T00:00:00").toLocaleDateString("fr-FR")}<br><span class="muted">${boundaryLabel(BOUNDARIES[r.start_idx])}–${boundaryLabel(BOUNDARIES[r.end_idx])}</span></td>
      <td>${r.requester_name}${r.requester_discord ? `<br><span class="muted">${r.requester_discord}</span>` : ""}</td>
      <td>${r.category}<br><span class="muted">${r.target_type === 'autre' ? r.target_other : r.target_type}</span></td>
      <td>${r.animator_count}</td>
      <td><span class="status-pill ${statusColor}">${statusLabel}</span></td>
      <td>
        ${r.status === "approved" ? `<button class="btn danger" data-cancel="${r.id}" style="padding:6px 10px;font-size:12px">Annuler</button>` : ""}
      </td>
    </tr>`;
  }).join("");

  const blockedRows = state.blockedSlots.map(b => `
    <tr>
      <td>${new Date(b.date + "T00:00:00").toLocaleDateString("fr-FR")}</td>
      <td>${boundaryLabel(BOUNDARIES[b.start_idx])}–${boundaryLabel(BOUNDARIES[b.end_idx])}</td>
      <td>${b.reason || ""}</td>
      <td><button class="btn danger" data-unblock="${b.id}" style="padding:6px 10px;font-size:12px">Supprimer</button></td>
    </tr>`).join("");

  app.innerHTML = `
    ${topbar("admin")}
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${todayCount}</div><div class="label">AUJOURD'HUI</div></div>
      <div class="stat-box"><div class="num">${monthCount}</div><div class="label">CONFIRMÉES CE MOIS</div></div>
      <div class="stat-box"><div class="num">${cancelledCount}</div><div class="label">ANNULÉES</div></div>
    </div>

    <div class="card">
      <h2>Réservations</h2>
      <div class="filters">
        <select id="filter-status">
          <option value="all">Tous statuts</option>
          <option value="approved">Confirmées</option>
          <option value="cancelled">Annulées</option>
        </select>
        <select id="filter-category">
          <option value="all">Toutes catégories</option>
          ${CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join("")}
        </select>
        <select id="filter-target">
          <option value="all">Tous publics</option>
          ${TARGET_TYPES.map(t => `<option value="${t.id}">${t.label}</option>`).join("")}
        </select>
      </div>
      <table class="admin-table">
        <thead><tr><th>Date</th><th>Demandeur</th><th>Type</th><th>Anim.</th><th>Statut</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" class="muted">Aucune réservation ce mois-ci.</td></tr>`}</tbody>
      </table>
    </div>

    <div class="card">
      <h2>Créneaux bloqués manuellement</h2>
      <table class="admin-table">
        <thead><tr><th>Date</th><th>Horaire</th><th>Raison</th><th></th></tr></thead>
        <tbody>${blockedRows || `<tr><td colspan="4" class="muted">Aucun créneau bloqué.</td></tr>`}</tbody>
      </table>
      <div class="row-actions"><button class="btn secondary" id="add-block-btn">+ Bloquer un créneau</button></div>
    </div>

    <div class="card">
      <h2>Paramètres</h2>
      <label>Nombre maximum d'animateurs simultanés</label>
      <input type="text" id="max-animators-input" value="${state.maxAnimators}">
      <div class="row-actions"><button class="btn secondary" id="save-settings-btn">Enregistrer</button></div>
    </div>
  `;
  bindNav();
  document.getElementById("filter-status").value = state.filters.status;
  document.getElementById("filter-category").value = state.filters.category;
  document.getElementById("filter-target").value = state.filters.target;
  document.getElementById("filter-status").onchange = e => { state.filters.status = e.target.value; render(); };
  document.getElementById("filter-category").onchange = e => { state.filters.category = e.target.value; render(); };
  document.getElementById("filter-target").onchange = e => { state.filters.target = e.target.value; render(); };

  document.querySelectorAll("[data-cancel]").forEach(btn => btn.onclick = () => {
    if (confirm("Annuler cette réservation ?")) setStatus(btn.dataset.cancel, "cancelled");
  });
  document.querySelectorAll("[data-unblock]").forEach(btn => btn.onclick = () => removeBlock(btn.dataset.unblock));
  document.getElementById("add-block-btn").onclick = openBlockForm;
  document.getElementById("save-settings-btn").onclick = async () => {
    const val = parseInt(document.getElementById("max-animators-input").value, 10);
    if (!val || val < 1) { showToast("Entre un nombre valide."); return; }
    await sb.from("settings").upsert({ key: "max_animators", value: String(val) });
    state.maxAnimators = val;
    showToast("Paramètres enregistrés.");
  };
}

async function loadAdminData() {
  const y = state.visibleMonth.getFullYear();
  const m = state.visibleMonth.getMonth();
  const first = toDateStr(new Date(y, m, 1));
  const last = toDateStr(new Date(y, m + 1, 0));
  const { data } = await sb.from("reservations").select("*").gte("date", first).lte("date", last).order("date");
  state.adminReservations = data || [];
  await loadMonthData();
}

async function setStatus(id, status) {
  await sb.from("reservations").update({ status }).eq("id", id);
  await loadAdminData();
  render();
}

function openBlockForm() {
  let overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "modal-overlay";
  const startOpts = BOUNDARIES.slice(0, -1).map((h, i) => `<option value="${i}">${boundaryLabel(h)}</option>`).join("");
  overlay.innerHTML = `
    <div class="modal">
      <button class="close-x" id="modal-close">✕</button>
      <h2>Bloquer un créneau</h2>
      <label>Date</label>
      <input type="date" id="b-date" value="${toDateStr(new Date())}">
      <label>Heure de début</label>
      <select id="b-start">${startOpts}</select>
      <label>Heure de fin</label>
      <select id="b-end">${BOUNDARIES.slice(1).map((h, i) => `<option value="${i + 1}">${boundaryLabel(h)}</option>`).join("")}</select>
      <label>Raison (facultatif)</label>
      <input type="text" id="b-reason" placeholder="ex: réunion animateurs">
      <div class="row-actions">
        <button class="btn secondary" id="b-cancel">Annuler</button>
        <button class="btn" id="b-confirm">Bloquer</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("modal-close").onclick = () => overlay.remove();
  document.getElementById("b-cancel").onclick = () => overlay.remove();
  document.getElementById("b-confirm").onclick = async () => {
    const date = document.getElementById("b-date").value;
    const start_idx = parseInt(document.getElementById("b-start").value, 10);
    const end_idx = parseInt(document.getElementById("b-end").value, 10);
    const reason = document.getElementById("b-reason").value;
    if (end_idx <= start_idx) { showToast("L'heure de fin doit être après le début."); return; }
    await sb.from("blocked_slots").insert({ date, start_idx, end_idx, reason });
    overlay.remove();
    await loadAdminData();
    render();
  };
}

async function removeBlock(id) {
  await sb.from("blocked_slots").delete().eq("id", id);
  await loadAdminData();
  render();
}

/* ================== DEMARRAGE ================== */
async function init() {
  if (!sb) {
    app.innerHTML = `<div class="card"><h2>Configuration manquante</h2>
      <p class="muted">Renseigne SUPABASE_URL et SUPABASE_ANON_KEY en haut du fichier pour activer le site.</p></div>`;
    return;
  }
  await loadSettings();
  await loadMonthData();
  render();
}
init();
</script>
</body>
